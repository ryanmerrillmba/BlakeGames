<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spooky Time!</title>
  <style>
    :root { --ink:#20152f; --paper:#fff6d9; --pink:#ff6b9d; --green:#55d38b; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 50% 0%,#5d2d77,#211738 65%); color:var(--paper); font-family:system-ui, sans-serif; }
    main { width:min(960px,100%); padding:18px; text-align:center; }
    h1 { margin:0 0 4px; font-size:clamp(2rem,6vw,4rem); letter-spacing:2px; color:#ffd36a; text-shadow:4px 4px #4b235d; }
    p { margin:4px 0 12px; font-weight:700; }
    #game { width:100%; max-width:900px; aspect-ratio:16/9; display:block; margin:auto; border:6px solid #ffd36a; border-radius:18px; background:#11172c; box-shadow:0 12px 0 #140e24, 0 18px 30px #0008; image-rendering:auto; }
    .bar { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:14px auto 0; align-items:center; }
    button { border:0; border-radius:999px; padding:10px 18px; background:#ffd36a; color:var(--ink); font-weight:900; cursor:pointer; box-shadow:0 4px 0 #bd733c; }
    button:active { transform:translateY(3px); box-shadow:0 1px 0 #bd733c; }
    #score { color:#a7ffca; }
    #hearts { width:min(420px,90%); height:16px; margin:8px auto 0; border:3px solid #ff9bb6; border-radius:999px; background:#351d3d; overflow:hidden; }
    #heartFill { height:100%; width:100%; background:linear-gradient(90deg,#ff4f7b,#ff9d6b); transition:width .15s; }
    #costumes { margin:12px auto; padding:18px; max-width:760px; border:6px solid #b87945; border-radius:8px; background:linear-gradient(135deg,#9a6039,#d3985b 48%,#8b5234); box-shadow:inset 0 0 0 4px #6d3f2d, 0 8px 0 #3b2430; }
    #costumes h2 { margin:0 0 10px; color:#fff0b0; text-shadow:2px 2px #6d3f2d; }
    #costumeButtons { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
    .costume { min-width:145px; padding:10px 12px; background:#46345a; color:#fff6d9; border:3px solid #806894; border-radius:4px; box-shadow:inset 0 -4px 0 #2b213f; font-size:1rem; }
    .costume.selected { background:#55d38b; color:#20152f; border-color:#a7ffca; }
    .tiny { font-size:.85rem; opacity:.85; }
  </style>
</head>
<body>
<main>
  <h1>🎃 SPOOKY TIME! 👻</h1>
  <p>Move with <b>WASD</b> or the arrow keys. Find Ghosties, defeat every bad guy.</p>
  <section id="costumes"><h2>📦 HALLOWEEN COSTUME BOX</h2><p>Step inside the box and choose who you want to be!</p><div id="costumeButtons"></div><button id="startGame">Start the spooky game</button></section>
  <canvas id="game" width="900" height="506" aria-label="Spooky Time game"></canvas>
  <div id="hearts" aria-label="15 heart health bar"><div id="heartFill"></div></div>
  <div class="bar"><span id="score">8 GHOSTIES: 0 / 8</span><button id="again">Play again</button></div>
  <p class="tiny">The Poison Sea Well is dangerous. Stay out of the lake unless you can float or fly!</p>
</main>
<script>
const canvas = document.querySelector('#game'), ctx = canvas.getContext('2d');
const scoreEl = document.querySelector('#score'), heartFill = document.querySelector('#heartFill'), costumeBox=document.querySelector('#costumes'), costumeButtons=document.querySelector('#costumeButtons');
const W=900,H=506, keys={}, start={x:450,y:265};
let player, items, well, won, message, last=0, gameStarted=false, selectedCostume='zombie';
const costumes={zombie:'🧟 Zombie',pumpkin:'🎃 Pumpkin',skeleton:'💀 Skeleton',frankenstein:'🧟‍♂️ Frankenstein',rat:'🐀 Rat',jackolantern:'🎃 Jack-o’-Lantern',spider:'🕷️ Spider',werewolf:'🐺 Werewolf',vampire:'🧛 Vampire',witch:'🧙 Witch'};

Object.entries(costumes).forEach(([key,label])=>{let b=document.createElement('button');b.className='costume';b.dataset.costume=key;b.textContent=label;b.style.borderColor=costumeColors[key];b.onclick=()=>{selectedCostume=key;document.querySelectorAll('.costume').forEach(x=>x.classList.toggle('selected',x===b));};costumeButtons.appendChild(b);});
document.querySelector('.costume').classList.add('selected');document.querySelector('#startGame').onclick=()=>{gameStarted=true;costumeBox.style.display='none';reset();};
const walls=[{x:65,y:120,w:155,h:24},{x:270,y:105,w:120,h:24},{x:450,y:125,w:190,h:24},{x:700,y:105,w:135,h:24},{x:115,y:205,w:210,h:24},{x:385,y:205,w:145,h:24},{x:600,y:220,w:220,h:24},{x:55,y:285,w:155,h:24},{x:270,y:305,w:175,h:24},{x:505,y:295,w:125,h:24},{x:690,y:300,w:155,h:24},{x:180,y:410,w:160,h:24},{x:430,y:425,w:190,h:24},{x:230,y:65,w:24,h:170},{x:335,y:150,w:24,h:145},{x:545,y:65,w:24,h:170},{x:725,y:165,w:24,h:155},{x:85,y:345,w:24,h:95},{x:465,y:335,w:24,h:110},{x:250,y:370,w:24,h:60},{x:380,y:375,w:24,h:58},{x:585,y:365,w:24,h:70}];
const names=['Ghosty','King of Cobras','Blood Giant','Stutman','Corrupt O','King Dragon','Corrupt Slug','The Weird Ditcher','Bunny Stickman','Sea Well'];
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true; if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelector('#again').onclick=reset;
function reset(){ player={...start,r:17,helper:false,weapon:true,superWeapon:false,ghostCount:0,hp:15,hurtCooldown:0,level:1}; won=false; message='LEVEL 1: Fight King Cobra!'; well={x:105,y:400,r:55,vx:1.2,vy:-.7,bossRank:6,defeated:false}; items=[
  {x:160,y:115,kind:'ghost',name:names[0],got:false,hostile:false,vx:1.1,vy:.7,fly:true,followSlot:0},
  {x:220,y:305,kind:'ghost',name:names[0],got:false,hostile:false,vx:-.8,vy:.9,fly:true,followSlot:1},
  {x:720,y:95,kind:'ghost',name:names[0],got:false,hostile:false,vx:-1,vy:.6,fly:true,followSlot:2},

  {x:420,y:390,kind:'ghost',name:names[0],got:false,hostile:false,vx:.7,vy:-.6,fly:true,followSlot:4},
  {x:100,y:250,kind:'ghost',name:names[0],got:false,hostile:false,vx:.8,vy:.6,fly:true,followSlot:5},
  {x:820,y:250,kind:'ghost',name:names[0],got:false,hostile:false,vx:-.8,vy:.7,fly:true,followSlot:6},
  {x:560,y:90,kind:'ghost',name:names[0],got:false,hostile:false,vx:.6,vy:.8,fly:true,followSlot:7},
  {x:670,y:180,kind:'cobra',name:names[1],got:false,hostile:true,vx:-1.2,vy:.8,bossRank:1},
  {x:440,y:100,kind:'skeleton',name:'Giant Breaker',got:false,hostile:true,vx:1,vy:1.1,bossRank:2},
  {x:660,y:145,kind:'bunny',name:'Bunny Stickman',got:false,hostile:true,vx:-1.1,vy:.8,bossRank:3},
  {x:590,y:380,kind:'dragon',name:names[5],got:false,hostile:true,vx:1.2,vy:-.8,fly:true,bossRank:8},
  {x:560,y:260,kind:'slug',name:names[6],got:false,hostile:true,vx:.8,vy:-.5,bossRank:5},

  {x:760,y:330,kind:'corrupt',name:names[4],got:false,hostile:true,vx:-.7,vy:-.4,bossRank:7}]; updateScore(); }
function updateScore(){let n=items.filter(i=>i.hostile&&i.got).length+(well&&well.defeated?1:0); scoreEl.textContent=`8 GHOSTIES: ${player?player.ghostCount:0}/8   |   Hearts: ${player?player.hp:15}/15   |   Bad guys defeated: ${n} / 8${player&&player.superWeapon?'  |  DIAMOND SWORD READY!':'  |  FIND ALL 8 FOR THE SWORD'}`;if(heartFill)heartFill.style.width=`${Math.max(0,Math.min(15,player?player.hp:15))/15*100}%`;}
function isActive(i){if(i.kind==='ghost')return true;return i.bossRank===1||bossUnlocked(i.bossRank);}
function text(t,x,y,size=28,color='#fff6d9',align='center'){ctx.font=`900 ${size}px system-ui`;ctx.textAlign=align;ctx.fillStyle=color;ctx.fillText(t,x,y);}
function cityLevel(){return player&&player.level>=2||items&&items.some(i=>i.kind==='skeleton'&&isActive(i)&&!i.got);}
function drawBg(){
  if(player&&player.level===1){ctx.fillStyle='#26213b';ctx.fillRect(0,0,W,H);ctx.fillStyle='#46345a';ctx.fillRect(0,60,W,H-60);ctx.fillStyle='#5c4670';for(let x=0;x<W;x+=54){for(let y=75;y<H;y+=54){ctx.fillRect(x+3,y+3,48,48);}}ctx.fillStyle='#164f70';ctx.fillRect(24,365,W-48,68);ctx.fillStyle='#237b91';ctx.fillRect(24,365,W-48,8);ctx.strokeStyle='#6ae4d0';ctx.lineWidth=2;for(let y=385;y<430;y+=24){for(let x=45+(y%55);x<W-40;x+=90){ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+18,y-7,x+36,y);ctx.stroke();}}ctx.fillStyle='#171a2d';ctx.fillRect(0,0,W,60);text('LEVEL 1 • KING OF COBRAS',W/2,39,18,'#ffd36a');return;}
  if(cityLevel()){ctx.fillStyle='#171b2d';ctx.fillRect(0,0,W,H);ctx.fillStyle='#30364b';ctx.fillRect(0,350,W,156);ctx.fillStyle='#252a3c';ctx.fillRect(0,60,W,290);let buildings=[[45,155,145,195],[235,105,135,245],[420,175,170,175],[650,95,190,255]];buildings.forEach((b,n)=>{let wobble=Math.sin(performance.now()/500+n)*2;ctx.fillStyle=n%2?'#68506d':'#4d5b72';ctx.fillRect(b[0]+wobble,b[1],b[2],b[3]);ctx.fillStyle='#9b6f83';ctx.fillRect(b[0]+wobble,b[1],b[2],8);for(let y=b[1]+25;y<b[1]+b[3]-15;y+=30){for(let x=b[0]+18;x<b[0]+b[2]-12;x+=35){ctx.fillStyle=(x+y+n)%3?'#ffd36a':'#ff6b6b';ctx.fillRect(x,y,12,15);}}ctx.strokeStyle='#b51f3a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(b[0]+b[2]*.55,b[1]+30);ctx.lineTo(b[0]+b[2]*.48,b[1]+90);ctx.lineTo(b[0]+b[2]*.65,b[1]+135);ctx.stroke();});ctx.fillStyle='#1b2032';ctx.fillRect(0,350,W,12);ctx.strokeStyle='#59627e';ctx.lineWidth=3;for(let x=0;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,362);ctx.lineTo(x+55,506);ctx.stroke();}text('BONE BREAKER CITY',W/2,39,18,'#ffcf6b');return;}
  ctx.fillStyle='#25283f';ctx.fillRect(0,0,W,H);ctx.fillStyle='#353955';ctx.fillRect(0,60,W,H-60);
  ctx.strokeStyle='#4b5070';ctx.lineWidth=3;for(let x=0;x<W;x+=45){ctx.beginPath();ctx.moveTo(x,60);ctx.lineTo(x,H);ctx.stroke();}for(let y=75;y<H;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

function drawCostumeDetails(){ctx.lineWidth=3;ctx.strokeStyle='#ffcf6b';if(selectedCostume==='zombie'){ctx.beginPath();ctx.moveTo(-8,12);ctx.lineTo(-2,16);ctx.lineTo(6,12);ctx.moveTo(-10,25);ctx.lineTo(-4,29);ctx.stroke();}if(selectedCostume==='rat'){ctx.strokeStyle='#f4c6e8';ctx.beginPath();ctx.moveTo(14,25);ctx.quadraticCurveTo(31,34,27,45);ctx.moveTo(-14,3);ctx.lineTo(-27,-4);ctx.moveTo(-14,6);ctx.lineTo(-28,8);ctx.stroke();}if(selectedCostume==='werewolf'){ctx.fillStyle='#e8d1c8';ctx.beginPath();ctx.moveTo(-13,6);ctx.lineTo(-21,0);ctx.lineTo(-15,14);ctx.moveTo(13,6);ctx.lineTo(21,0);ctx.lineTo(15,14);ctx.fill();ctx.strokeStyle='#fff6d9';ctx.beginPath();ctx.moveTo(-18,20);ctx.lineTo(-25,25);ctx.moveTo(18,20);ctx.lineTo(25,25);ctx.stroke();}if(selectedCostume==='witch'){ctx.fillStyle='#ffd36a';ctx.fillRect(-13,14,26,4);ctx.strokeStyle='#c29bff';ctx.beginPath();ctx.moveTo(-12,11);ctx.lineTo(0,5);ctx.lineTo(12,11);ctx.stroke();}if(selectedCostume==='jackolantern'){ctx.strokeStyle='#ffef9a';ctx.beginPath();ctx.arc(0,16,8,0,7);ctx.moveTo(-6,10);ctx.lineTo(6,22);ctx.moveTo(6,10);ctx.lineTo(-6,22);ctx.stroke();}}
function drawCustomHead(){if(selectedCostume==='rat'){ctx.fillStyle='#9c849e';ctx.beginPath();ctx.arc(0,-5,15,0,7);ctx.fill();ctx.fillStyle='#d99fbc';ctx.beginPath();ctx.arc(-11,-17,7,0,7);ctx.arc(11,-17,7,0,7);ctx.fill();ctx.fillStyle='#24313d';ctx.beginPath();ctx.arc(-6,-7,2,0,7);ctx.arc(6,-7,2,0,7);ctx.fill();ctx.fillStyle='#f08aa6';ctx.beginPath();ctx.arc(0,1,4,0,7);ctx.fill();ctx.strokeStyle='#f4c6e8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-2,1);ctx.lineTo(-25,-2);ctx.moveTo(-2,4);ctx.lineTo(-25,8);ctx.moveTo(2,1);ctx.lineTo(25,-2);ctx.moveTo(2,4);ctx.lineTo(25,8);ctx.stroke();}else if(selectedCostume==='pumpkin'){ctx.fillStyle='#e58a35';ctx.beginPath();ctx.ellipse(0,-7,17,15,0,0,7);ctx.fill();ctx.strokeStyle='#a84f2b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-6,-20);ctx.lineTo(-6,6);ctx.moveTo(6,-20);ctx.lineTo(6,6);ctx.stroke();ctx.fillStyle='#6fa34b';ctx.fillRect(-3,-24,6,6);}else if(selectedCostume==='jackolantern'){ctx.fillStyle='#9b3f20';ctx.beginPath();ctx.ellipse(0,-7,18,16,0,0,7);ctx.fill();ctx.fillStyle='#21152d';ctx.beginPath();ctx.moveTo(-11,-11);ctx.lineTo(-4,-14);ctx.lineTo(-6,-5);ctx.moveTo(5,-14);ctx.lineTo(12,-11);ctx.lineTo(7,-5);ctx.moveTo(-9,1);ctx.lineTo(0,7);ctx.lineTo(9,1);ctx.lineTo(0,11);ctx.closePath();ctx.fill();ctx.fillStyle='#ffd36a';ctx.beginPath();ctx.arc(-7,-9,2,0,7);ctx.arc(7,-9,2,0,7);ctx.fill();ctx.fillStyle='#425f31';ctx.fillRect(-3,-24,6,6);}else{text({zombie:'🧟',skeleton:'💀',frankenstein:'🧟‍♂️',spider:'🕷️',werewolf:'🐺',vampire:'🧛',witch:'🧙'}[selectedCostume]||'🎃',0,8,34);}}
function drawPlayer(){ctx.save();ctx.translate(player.x,player.y);let avatar={zombie:'🧟',pumpkin:'🎃',skeleton:'💀',frankenstein:'🧟‍♂️',rat:'🐀',jackolantern:'🎃',spider:'🕷️',werewolf:'🐺',vampire:'🧛',witch:'🧙'}[selectedCostume];let bodyColor={zombie:'#79d681',pumpkin:'#e58a35',skeleton:'#e8e2cf',frankenstein:'#6eb879',rat:'#9c849e',jackolantern:'#e58a35',spider:'#392b55',werewolf:'#8c7b83',vampire:'#5f405f',witch:'#4f3e82'}[selectedCostume]||'#79d681';ctx.fillStyle=bodyColor;ctx.beginPath();ctx.ellipse(0,16,15,19,0,0,7);ctx.fill();ctx.strokeStyle=bodyColor;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-11,8);ctx.lineTo(-24,19);ctx.moveTo(11,8);ctx.lineTo(24,19);ctx.moveTo(-7,29);ctx.lineTo(-12,42);ctx.moveTo(7,29);ctx.lineTo(12,42);ctx.stroke();ctx.strokeStyle=costumeColors[selectedCostume]||'#fff';ctx.lineWidth=2;if(selectedCostume==='pumpkin'||selectedCostume==='jackolantern'){ctx.beginPath();ctx.moveTo(-7,3);ctx.lineTo(-5,29);ctx.moveTo(7,3);ctx.lineTo(5,29);ctx.stroke();}else if(selectedCostume==='skeleton'){ctx.beginPath();ctx.moveTo(-8,10);ctx.lineTo(8,10);ctx.moveTo(-9,17);ctx.lineTo(9,17);ctx.moveTo(-8,24);ctx.lineTo(8,24);ctx.stroke();}else if(selectedCostume==='frankenstein'){ctx.fillStyle='#243b35';ctx.fillRect(-10,12,20,4);ctx.fillRect(-10,22,20,4);}else if(selectedCostume==='vampire'){ctx.fillStyle='#ff4f7b';ctx.beginPath();ctx.moveTo(-10,5);ctx.lineTo(0,18);ctx.lineTo(10,5);ctx.fill();}else if(selectedCostume==='witch'){ctx.strokeStyle='#ffd36a';ctx.beginPath();ctx.arc(0,16,10,0,7);ctx.stroke();}if(selectedCostume==='spider'){ctx.lineWidth=3;for(let a=-1;a<=1;a+=2){ctx.beginPath();ctx.moveTo(a*8,12);ctx.lineTo(a*28,0);ctx.moveTo(a*10,20);ctx.lineTo(a*31,25);ctx.moveTo(a*8,27);ctx.lineTo(a*25,43);ctx.stroke();}}drawCostumeDetails();if(selectedCostume==='rat'||selectedCostume==='jackolantern')drawCustomHead();else text(avatar,0,8,34);if(player.superWeapon){ctx.shadowColor='#4de9ff';ctx.shadowBlur=14;ctx.strokeStyle='#4de9ff';ctx.lineWidth=7;ctx.beginPath();ctx. function circleHitsWall(x,y,r){if((player&&player.level===1)||cityLevel())return false;return walls.some(w=>x+r>w.x&&x-r<w.x+w.w&&y+r>w.y&&y-r<w.y+w.h);}
function move(){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(dx||dy){let l=Math.hypot(dx,dy),nx=player.x+dx/l*3.3,ny=player.y+dy/l*3.3;if(!circleHitsWall(nx,player.y,player.r))player.x=nx;if(!circleHitsWall(player.x,ny,player.r))player.y=ny;}player.x=Math.max(25,Math.min(W-25,player.x));player.y=Math.max(75,Math.min(H-55,player.y));}
function isWater(x,y,r){return y+r>365&&y-r<433&&x>24&&x<W-24;}
function wander(o){if(o.kind==='cat'&&o.jumpFrames>0)o.jumpFrames--;let passWalls=o.fly||(o.kind==='cat'&&o.jumpFrames>0),canWater=o.kind==='ghost'||o.kind==='dragon';let nx=o.x+o.vx,ny=o.y+o.vy;let blocked=(!passWalls&&circleHitsWall(nx,ny,24))||(!canWater&&isWater(nx,ny,24));if(blocked){let old=o.vx;o.vx=-o.vy;o.vy=old;nx=o.x+o.vx;ny=o.y+o.vy;if((!passWalls&&circleHitsWall(nx,ny,24))||(!canWater&&isWater(nx,ny,24))){o.vx=-o.vx;o.vy=-o.vy;}else{o.x=nx;o.y=ny;}}else{o.x=nx;o.y=ny;}if(o.x<45||o.x>W-45)o.vx*=-1;if(o.y<75||o.y>H-90)o.vy*=-1;if(o.kind==='cat'&&!o.jumpUsed&&Math.hypot(player.x-o.x,player.y-o.y)<220){o.jumpUsed=true;o.jumpFrames=55;message='Rocket Cat used its one wall jump!';}}
function wanderWell(){if(!bossUnlocked(6))return;well.x+=well.vx;well.y+=well.vy;if(well.x<85||well.x>W-85)well.vx*=-1;if(well.y<385||well.y>425)well.vy*=-1;}
function bossUnlocked(rank){let defeated=items.filter(i=>i.hostile&&i.got).length;return rank===1||(player.superWeapon&&defeated>=rank-1);}
function startGhostHunt(){player.level=2;player.weapon=false;player.superWeapon=false;player.ghostCount=0;player.x=start.x;player.y=start.y;items.filter(i=>i.kind==='ghost').forEach((g,n)=>{g.got=false;g.x=80+(n%4)*220;g.y=95+Math.floor(n/4)*170;});message='LEVEL 2: The Ghosties scattered! Catch them all for the diamond sword.';updateScore();}
  function loop(t){if(!gameStarted){requestAnimationFrame(loop);return;}let dt=t-last;last=t;move();player.hurtCooldown=Math.max(0,player.hurtCooldown-1);items.forEach(i=>{if(!isActive(i))return;if(i.got){if(i.kind==='ghost'){let a=i.followSlot*.9+1;i.x=player.x+Math.cos(a)*42;i.y=player.y+Math.sin(a)*28-30;}return;}wander(i);});wanderWell();drawBg();drawWell();drawWellPokers();items.forEach(drawItem);drawPlayer();let hit=Math.hypot(player.x-well.x,player.y-well.y)<player.r+well.r;if(hit&&!well.defeated&&bossUnlocked(6)){if(player.weapon){well.defeated=true;message='The diamond sword defeated the Poison Sea Well!';updateScore();}else if(player.hurtCooldown===0){player.hp=Math.max(1,player.hp-1);player.hurtCooldown=45;player.x=start.x;player.y=start.y;message='The Poison Sea Well took one heart!';updateScore();}}
  items.forEach(i=>{if(!isActive(i)||i.got)return;let d=Math.hypot(player.x-i.x,player.y-i.y);if(i.kind==='ghost'&&d<42){i.got=true;player.helper=true;player.ghostCount++;if(player.ghostCount>=8){player.superWeapon=true;player.weapon=true;message='All 8 Ghosties gave you the DIAMOND SWORD!';}else{message=`Ghosty caught! ${8-player.ghostCount} more for the diamond sword.`;}updateScore();}else if(i.hostile&&d<45&&bossUnlocked(i.bossRank)){if(player.weapon){i.got=true;message=`${player.superWeapon?'DIAMOND SWORD':'STARTER WEAPON'} defeated ${i.name}!`;updateScore();if(i.kind==='cobra')startGhostHunt();}else if(player.hurtCooldown===0){player.hp=Math.max(1,player.hp-1);player.hurtCooldown=45;player.x=start.x;player.y=start.y;message=`${i.name} took one heart!`;updateScore();}}});
  if(player.hp<=0){player.hp=15;message='You lost all your hearts! Back to the start!';player.x=start.x;player.y=start.y;updateScore();}if(items.filter(i=>i.hostile&&!i.got).length===0&&well.defeated){won=true;message='YOU DID IT! You beat every boss!';}ctx.fillStyle='#20152fdd';ctx.fillRect(20,H-52,W-40,36);text(message,W/2,H-27,18,won?'#ffd36a':'#fff6d9');requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
