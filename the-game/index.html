<!doctype html>
<html lang="en" data-game="the-game">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Game — Blake Games</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        overflow: hidden;
        background: #1e293b;
        color: #f8fafc;
        font-family: "Fredoka", "Space Grotesk", system-ui, -apple-system, sans-serif;
        user-select: none;
      }
      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        right: 16px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        pointer-events: none;
        z-index: 10;
      }
      .panel {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        border: 2px solid rgba(148, 163, 184, 0.35);
        border-radius: 16px;
        padding: 12px 18px;
        pointer-events: auto;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
        max-width: 480px;
      }
      .back-btn {
        display: inline-block;
        color: #93c5fd;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.95rem;
        margin-bottom: 6px;
      }
      .back-btn:hover {
        text-decoration: underline;
      }
      h1 {
        font-size: 1.4rem;
        color: #facc15;
        margin-bottom: 4px;
      }
      #objective {
        font-size: 1rem;
        color: #e2e8f0;
        line-height: 1.35;
      }
      #controls-hint {
        font-size: 0.9rem;
        color: #cbd5e1;
        text-align: right;
      }
      #action-prompt {
        position: fixed;
        bottom: 36px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(250, 204, 21, 0.96);
        color: #0f172a;
        border: none;
        font-weight: 800;
        font-size: 1.15rem;
        padding: 12px 26px;
        border-radius: 999px;
        box-shadow: 0 8px 25px rgba(250, 204, 21, 0.4);
        display: none;
        cursor: pointer;
        z-index: 15;
      }
      #minimap-wrap {
        position: fixed;
        bottom: 16px;
        left: 16px;
        background: rgba(15, 23, 42, 0.88);
        border: 2px solid rgba(148, 163, 184, 0.45);
        border-radius: 14px;
        padding: 8px;
        z-index: 14;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        text-align: center;
      }
      #minimap-label {
        font-size: 0.78rem;
        color: #cbd5e1;
        margin-top: 4px;
        font-weight: 700;
      }
      #start-overlay {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, rgba(15, 23, 42, 0.85), rgba(2, 6, 23, 0.96));
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 40;
        padding: 20px;
        text-align: center;
      }
      #start-overlay img {
        max-height: 62vh;
        max-width: 90vw;
        border-radius: 20px;
        border: 3px solid #facc15;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
        margin-bottom: 18px;
      }
      #start-play-btn {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: #ffffff;
        border: none;
        font-size: 1.4rem;
        font-weight: 800;
        padding: 14px 38px;
        border-radius: 999px;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(34, 197, 94, 0.45);
      }
      #start-play-btn:hover {
        transform: scale(1.05);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="start-overlay">
      <img src="./guys.png" alt="The Game Monsters" />
      <button id="start-play-btn" type="button">▶ PLAY THE GAME!</button>
    </div>

    <div id="hud">
      <div class="panel">
        <a class="back-btn" href="../index.html">← Back to Blake Games</a>
        <h1>The Game <span id="money-hud" style="color:#4ade80; font-size:1.1rem; margin-left:10px;">💰 $0</span></h1>
        <div id="objective">Objective: Walk through the door into the weird lab!</div>
      </div>
      <div class="panel" id="controls-hint">
        <strong>Move:</strong> Click/Drag Mouse, or W A S D / Arrows<br />
        <strong>Action:</strong> SPACEBAR / E &nbsp;|&nbsp; <strong>Doors:</strong> F &nbsp;|&nbsp; <strong>Attack:</strong> Q
        <div style="margin-top:6px; display:flex; gap:6px; justify-content:flex-end;">
          <button id="shop-btn" type="button" style="background:#f59e0b;color:#0f172a;border:none;border-radius:8px;padding:5px 10px;font-weight:800;cursor:pointer;">🛒 Buy Crazy Weapon ($10)</button>
          <button id="battle-btn" type="button" style="background:#ef4444;color:#ffffff;border:none;border-radius:8px;padding:5px 10px;font-weight:800;cursor:pointer;">⚔️ Fight Outside!</button>
        </div>
      </div>
    </div>

    <button id="action-prompt" type="button">Action</button>

    <div id="minimap-wrap">
      <canvas id="minimap" width="170" height="170" style="border-radius:8px; display:block;"></canvas>
      <div id="minimap-label">🗺️ Map: 🔵 You | 🔴 Monster | 🟢 Cage</div>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b1628);
      scene.fog = new THREE.FogExp2(0x0b1628, 0.011);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 250);
      camera.position.set(0, 5, 7);

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.18;
      document.body.appendChild(renderer.domElement);

      // 10x Real-Time PBR Reflections: PMREM RoomEnvironment IBL for metallic armor, clearcoat slime & glossy eyes!
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      const envTexture = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environment = envTexture;
      scene.environmentIntensity = 0.72;
      pmremGenerator.dispose();

      // Post-Processing Bloom Composer (cinematic glow matching all_guys.png!)
      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      const bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.42, // strength
        0.65, // radius
        0.72  // threshold
      );
      composer.addPass(bloomPass);
      const bloomEnabled = true;

      // GPU Firefly / Spore Particle System (260 glowing points drifting through the forest!)
      const PARTICLE_COUNT = 260;
      const pGeo = new THREE.BufferGeometry();
      const pPos = new Float32Array(PARTICLE_COUNT * 3);
      const pCol = new Float32Array(PARTICLE_COUNT * 3);
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        pPos[i * 3] = (Math.random() - 0.5) * 110;
        pPos[i * 3 + 1] = 0.6 + Math.random() * 6.5;
        pPos[i * 3 + 2] = 4 + Math.random() * 110;
        const isBlue = i % 2 === 0;
        pCol[i * 3] = isBlue ? 0.25 : 1.0;
        pCol[i * 3 + 1] = isBlue ? 0.85 : 0.82;
        pCol[i * 3 + 2] = isBlue ? 1.0 : 0.25;
      }
      pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
      pGeo.setAttribute("color", new THREE.BufferAttribute(pCol, 3));
      const pMat = new THREE.PointsMaterial({
        size: 0.26,
        vertexColors: true,
        transparent: true,
        opacity: 0.85,
        depthWrite: false,
      });
      const fireflies = new THREE.Points(pGeo, pMat);
      scene.add(fireflies);

      let mixer = null;

      // Start Screen overlay (auto-hidden during ?autotest=1 or ?test=house)
      const startOverlay = document.getElementById("start-overlay");
      const urlParamsInit = new URLSearchParams(window.location.search);
      if (urlParamsInit.get("autotest") === "1" || urlParamsInit.get("test") === "house") {
        startOverlay.style.display = "none";
      }
      document.getElementById("start-play-btn").addEventListener("click", () => {
        startOverlay.style.display = "none";
        if (audioCtx.state === "suspended") audioCtx.resume();
        playChime();
      });

      // Clean moonlit night sky + Giant 3D Framed Poster on the Lab wall
      const pendingSprites = [];
      let loadedGuysImage = null;

      const posterTex = new THREE.TextureLoader().load("./guys.png", (tex) => {
        loadedGuysImage = tex.image;
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.needsUpdate = true;
        // Apply crisp cropped CanvasTexture to every queued monster sprite!
        for (const item of pendingSprites) applyCroppedCanvasTexture(item);
      });
      posterTex.colorSpace = THREE.SRGBColorSpace;

      const posterMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(4.2, 5.6),
        new THREE.MeshBasicMaterial({ map: posterTex })
      );
      posterMesh.position.set(0, 2.7, -25.6);
      scene.add(posterMesh);

      function applyCroppedCanvasTexture({ sprite, xFrac, yFrac, wFrac, hFrac }) {
        if (!loadedGuysImage) return;
        const iw = loadedGuysImage.width;
        const ih = loadedGuysImage.height;
        const cw = 320, ch = 360;
        const cv = document.createElement("canvas");
        cv.width = cw;
        cv.height = ch;
        const ctx = cv.getContext("2d");
        // Rounded glowing frame cutout so each realistic monster pops cleanly in 3D!
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(6, 6, cw - 12, ch - 12, 28);
        ctx.clip();
        ctx.drawImage(
          loadedGuysImage,
          xFrac * iw, yFrac * ih, wFrac * iw, hFrac * ih,
          0, 0, cw, ch
        );
        ctx.restore();
        ctx.strokeStyle = "#facc15";
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.roundRect(6, 6, cw - 12, ch - 12, 28);
        ctx.stroke();

        const cTex = new THREE.CanvasTexture(cv);
        cTex.colorSpace = THREE.SRGBColorSpace;
        cTex.needsUpdate = true;
        sprite.material.map = cTex;
        sprite.material.needsUpdate = true;
      }

      // Attach a cropped realistic PNG 3D Sprite from guys.png (top-down image fractions!)
      function attachRealisticSprite(monsterRoot, xFrac, yFrac, wFrac, hFrac, scaleW, scaleH, yPos = 1.6) {
        if (!monsterRoot) return;
        const mat = new THREE.SpriteMaterial({ transparent: true });
        const sprite = new THREE.Sprite(mat);
        sprite.name = monsterRoot.name + "_RealisticPNG";
        sprite.scale.set(scaleW, scaleH, 1);
        sprite.position.set(0, yPos, 0);
        // Hide old blocky meshes inside monsterRoot so ONLY the realistic PNG shows!
        monsterRoot.traverse((ch) => {
          if (ch.isMesh) ch.visible = false;
        });
        monsterRoot.add(sprite);
        const entry = { sprite, xFrac, yFrac, wFrac, hFrac };
        pendingSprites.push(entry);
        if (loadedGuysImage) applyCroppedCanvasTexture(entry);
      }

      // Cinematic Lighting matching all_guys.png (Moonlight + Hemisphere Rim + Warm Cabin + Neon Lab + Real Shadows!)
      const hemiLight = new THREE.HemisphereLight(0x93c5fd, 0x14532d, 1.35);
      scene.add(hemiLight);

      const ambient = new THREE.AmbientLight(0xdbeafe, 0.9);
      scene.add(ambient);

      const sunLight = new THREE.DirectionalLight(0xe0f2fe, 1.8);
      sunLight.position.set(18, 38, 22);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 1024;
      sunLight.shadow.mapSize.height = 1024;
      sunLight.shadow.camera.near = 1;
      sunLight.shadow.camera.far = 120;
      sunLight.shadow.camera.left = -45;
      sunLight.shadow.camera.right = 45;
      sunLight.shadow.camera.top = 45;
      sunLight.shadow.camera.bottom = -45;
      scene.add(sunLight);

      const cabinWarmLight = new THREE.PointLight(0xfbbf24, 16, 18);
      cabinWarmLight.position.set(-10, 3.0, 28);
      scene.add(cabinWarmLight);

      const darkRoomLight = new THREE.PointLight(0x93c5fd, 12, 22);
      darkRoomLight.position.set(0, 3.5, 0);
      scene.add(darkRoomLight);

      const labLight = new THREE.PointLight(0x38bdf8, 24, 38);
      labLight.position.set(0, 4.2, -15);
      scene.add(labLight);

      // Player Flashlight (with real-time shadows!)
      const flashlight = new THREE.SpotLight(0xfffbeb, 75, 38, Math.PI / 4, 0.35, 0.8);
      flashlight.castShadow = true;
      flashlight.shadow.mapSize.width = 512;
      flashlight.shadow.mapSize.height = 512;
      const flashlightTarget = new THREE.Object3D();
      scene.add(flashlight);
      scene.add(flashlightTarget);
      flashlight.target = flashlightTarget;

      // Game State
      let player = null;
      let legL = null, legR = null, armL = null, armR = null;
      let flashlightMesh = null;
      let clown = null;
      let clownLegL = null, clownLegR = null;
      let laserGuy = null;
      let laserLegL = null, laserLegR = null;
      let laserBeam = null;
      let laserTimer = 0;
      let laserActive = 0;
      let laserCaptured = false;
      let throwingLaser = false;
      let laserInCage = false;
      let laserMoneyTaken = false;
      let slimeGuy = null;
      let slimeCaptured = false;
      let throwingSlime = false;
      let slimeInCage = false;
      let slimeMoneyTaken = false;
      let shadowGuy = null;
      let shadowCaptured = false;
      let throwingShadow = false;
      let shadowInCage = false;
      let ghostGuy = null;
      let ghostCaptured = false;
      let throwingGhost = false;
      let ghostInCage = false;
      let ghostTeleportTimer = 0;

      // 9 Lab Monsters queue (Pods 4..12) unlocked one by one after Slime Guy!
      const labMonsterDefs = [
        { key: "Monster_Vampire", label: "🧛 Vampire", podIdx: 3, flies: false },
        { key: "Monster_Witch", label: "🧙 Witch", podIdx: 4, flies: true },
        { key: "Monster_Pumpkin", label: "🎃 Pumpkin", podIdx: 5, flies: false },
        { key: "Monster_Cat", label: "🐈‍⬛ Cat", podIdx: 6, flies: false },
        { key: "Monster_Bat", label: "🦇 Bat", podIdx: 7, flies: true },
        { key: "Monster_Spider", label: "🕷️ Spider", podIdx: 8, flies: false },
        { key: "Monster_Skeleton", label: "💀 Skeleton", podIdx: 9, flies: false },
        { key: "Monster_Eyeball", label: "👁️ Magical Eyeball", podIdx: 10, flies: true },
        { key: "Monster_Robot", label: "🤖 Robot", podIdx: 11, flies: false },
        { key: "Monster_Frankenstein", label: "🧟‍♂️ Frankenstein", podIdx: 12, flies: false },
        { key: "Monster_Zombie", label: "🧟 Zombie", podIdx: 13, flies: false },
        { key: "Monster_Werewolf", label: "🐺 Gray Werewolf", podIdx: 12, loftCageIdx: 0, flies: false },
        { key: "Monster_Mummy", label: "🧻 Mummy", podIdx: 13, loftCageIdx: 1, flies: false },
      ];
      let onLoft = false;
      const ladderPos = new THREE.Vector3(9.5, 0, -22.0);

      // 3 Super-Rare Hard-to-Find House Bosses (unlocks ONLY far in the game after Shadow Guy & Ghost!)
      const houseBossDefs = [
        { key: "Monster_RainbowSnake", label: "🌈🐍 Rainbow Snake (RARE BOSS)", cageIdx: 0, flies: false, speed: 3.4 },
        { key: "Monster_FlyingPumpkin", label: "🎃🪽 Crazy Flying Pumpkin (RARE BOSS)", cageIdx: 1, flies: true, speed: 4.2 },
        { key: "Monster_BoneBreaker", label: "🦴💥 Armored Bone Breaker (FINAL BOSS)", cageIdx: 2, flies: false, speed: 3.8 },
      ];
      let bossIdx = 0;
      let activeBossCaptured = false;
      let activeBossThrowing = false;
      let allBossesCaged = false;
      let labQueueIdx = 0; // active monster in labMonsterDefs after slimeInCage
      let activeLabCaptured = false;
      let activeLabThrowing = false;
      let allLabMonstersCaged = false;
      let podCap0 = null;
      let craftTableObj = null;
      let portalObjRef = null;
      let firstPodPos = new THREE.Vector3(-9.0, 0, -9.0);
      let secondPodPos = new THREE.Vector3(-4.5, 0, -10.5); // Laser Guy goes next to Clown in Lab!
      let thirdPodPos = new THREE.Vector3(0.0, 0, -10.0);   // Slime Guy goes next to Laser Guy in Lab!
      let rareCagePos = new THREE.Vector3(-12.6, 0, 30.8);  // Rare Shadow Guy goes in House Cage 1!
      let rareCage2Pos = new THREE.Vector3(-10.0, 0, 30.8); // Rare Ghost goes in House Cage 2!
      const colliders = []; // { name, category, box, mesh, active }
      const doorPivots = []; // { obj, openAngle, closedAngle, isOpen }
      const PLAYER_RADIUS = 0.30;

      let walkTime = 0;
      let stepTimer = 0;
      let level = 1;
      let visitedLab = false;
      let lightTurnedOn = false;
      let outsideEntered = false;
      let clownCaptured = false;
      let throwingClown = false;
      let throwProgress = 0;
      let throwStartPos = new THREE.Vector3();
      let clownInCage = false;
      let money = 0;
      let wood = 0;
      let stone = 0;
      let axeLevel = 0; // 0 = none, 1 = Lv.1 Axe + Pickaxe, 2 = Lv.2 Axe!
      let weaponTier = 0; // 0 = none, 1 = ⚡ Shock Blaster ($10), 2 = 🔥 Flame Sword ($20), 3 = 🌈 Freeze Ray ($35)
      let attackFlashTimer = 0;
      let monsterStunTimer = 0;
      let borrowedMoney = false;
      let paidForMoreRoom = false;

      const weaponNames = ["None", "⚡ Shock Blaster", "🔥 Flame Sword", "🌈 Freeze Ray"];
      const weaponCosts = [0, 10, 20, 35];

      // Glowing 3D Attack Blast Ring when you press Q!
      const attackRing = new THREE.Mesh(
        new THREE.TorusGeometry(2.6, 0.16, 12, 28),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
      );
      attackRing.rotation.x = Math.PI / 2;
      attackRing.visible = false;
      scene.add(attackRing);

      function updateHudStats() {
        let tools = "";
        if (axeLevel === 1) tools += " 🪓Lv1 ⛏️";
        if (axeLevel >= 2) tools += " 🪓Lv2 ⛏️";
        if (weaponTier > 0) tools += ` ${weaponNames[weaponTier]}`;
        moneyHudEl.textContent = `💰 $${money}  🪵${wood} 🪨${stone}${tools}`;
        const shopBtn = document.getElementById("shop-btn");
        if (shopBtn) {
          if (weaponTier < 3) {
            shopBtn.textContent = `🛒 Buy ${weaponNames[weaponTier + 1]} ($${weaponCosts[weaponTier + 1]})`;
          } else {
            shopBtn.textContent = "👑 MAX WEAPON: 🌈 Freeze Ray!";
          }
        }
      }

      document.getElementById("shop-btn").addEventListener("click", () => {
        if (weaponTier >= 3) return;
        const cost = weaponCosts[weaponTier + 1];
        if (money >= cost) {
          money -= cost;
          weaponTier += 1;
          updateHudStats();
          playChime();
          objectiveEl.textContent = `🎉 Bought ${weaponNames[weaponTier]}! Press Q to blast & stun monsters!`;
        } else {
          objectiveEl.textContent = `💰 Need $${cost} to buy ${weaponNames[weaponTier + 1]}! Catch monsters or chop trees/rocks!`;
        }
      });

      let battleMode = false;
      let battleEnemies = []; // { obj, label, hp }

      function startOutsideBattle() {
        if (!player) return;
        battleMode = true;
        battleEnemies = [];
        const pool = [
          { obj: clown, label: "🤡 Clown" },
          { obj: laserGuy, label: "🤖 Laser Guy" },
          { obj: slimeGuy, label: "🟢 Slime Guy" },
          { obj: shadowGuy, label: "👻 Shadow Guy" },
          { obj: ghostGuy, label: "👻💨 Ghost" },
        ];
        pool.forEach((p, idx) => {
          if (p.obj) {
            p.obj.visible = true;
            p.obj.position.set(-10 + idx * 5, 0, 14 + (idx % 2) * 5);
            battleEnemies.push({ obj: p.obj, label: p.label, hp: 3 });
          }
        });
        player.position.set(0, 0, 8);
        onLoft = false;
        playChime();
        objectiveEl.textContent = "⚔️ BATTLE MODE! The monsters came outside! Press Q to blast them with your Crazy Weapons!";
      }

      document.getElementById("battle-btn").addEventListener("click", startOutsideBattle);

      function fireWeaponAttack() {
        if (!player || weaponTier === 0) {
          objectiveEl.textContent = "🛒 Buy a Crazy Weapon first in the top-right shop, then press Q to attack!";
          return;
        }
        attackFlashTimer = 0.35;
        monsterStunTimer = 3.0 + weaponTier * 1.5;
        attackRing.position.set(player.position.x, player.position.y + 1.0, player.position.z);
        attackRing.material.color.setHex(weaponTier === 1 ? 0x38bdf8 : weaponTier === 2 ? 0xf97316 : 0xc084fc);
        attackRing.visible = true;
        playTone(weaponTier === 1 ? 520 : weaponTier === 2 ? 260 : 780, 0.25, "sawtooth", 0.2);

        if (battleMode && battleEnemies.length > 0) {
          let hits = 0;
          for (const e of battleEnemies) {
            if (e.hp <= 0) continue;
            const d = Math.hypot(player.position.x - e.obj.position.x, player.position.z - e.obj.position.z);
            if (d < 9.5) {
              e.hp -= weaponTier;
              hits++;
              if (e.hp <= 0) {
                e.obj.visible = false;
                money += 25;
                updateHudStats();
              }
            }
          }
          const alive = battleEnemies.filter((e) => e.hp > 0).length;
          if (alive === 0) {
            battleMode = false;
            playChime();
            objectiveEl.textContent = "🏆 YOU DEFEATED ALL THE MONSTERS OUTSIDE! (+$25 each!)";
          } else {
            objectiveEl.textContent = `💥 Hit ${hits} monster(s) with ${weaponNames[weaponTier]}! ${alive} left!`;
          }
        } else {
          objectiveEl.textContent = `💥 Fired ${weaponNames[weaponTier]}! Nearby monsters are STUNNED!`;
        }
      }

      // =========================================================================
      // LIFELIKE ARTICULATED CHARACTER ANIMATION ENGINE (Idle, Walk, Run, Fly, Slither & Alive-In-Cage!)
      // =========================================================================
      function getMonsterRig(root) {
        if (root.userData.rig) return root.userData.rig;
        const rig = {
          torso: null, head: null, hipL: null, hipR: null, shL: null, shR: null,
          wingL: null, wingR: null, tail: null,
          quadLegs: [], spiderLegs: [], roboArms: [], snakeSegs: [], magicRings: [],
          baseTorsoY: 0, baseHeadY: 0, baseSnakePos: [],
          phase: Math.random() * Math.PI * 2,
          prevX: root.position.x, prevZ: root.position.z,
          smoothSpeed: 0
        };
        root.traverse((c) => {
          const n = c.name;
          if (n.includes("_TorsoPivot")) { rig.torso = c; rig.baseTorsoY = c.position.y; }
          else if (n.includes("_HeadPivot")) { rig.head = c; rig.baseHeadY = c.position.y; }
          else if (n.includes("_HipPivot_L")) rig.hipL = c;
          else if (n.includes("_HipPivot_R")) rig.hipR = c;
          else if (n.includes("_ShoulderPivot_L")) rig.shL = c;
          else if (n.includes("_ShoulderPivot_R")) rig.shR = c;
          else if (n.includes("WingPivot_L")) rig.wingL = c;
          else if (n.includes("WingPivot_R")) rig.wingR = c;
          else if (n.includes("_TailPivot")) rig.tail = c;
          else if (n.includes("_HipPivot_FL") || n.includes("_HipPivot_FR") || n.includes("_HipPivot_BL") || n.includes("_HipPivot_BR")) {
            rig.quadLegs.push({ obj: c, isDiagA: n.includes("_FL") || n.includes("_BR") });
          } else if (n.includes("Spider_LegPivot_")) {
            rig.spiderLegs.push({ obj: c, idx: parseInt(n.split("_").pop(), 10) || 0, baseRotY: c.rotation.y });
          } else if (n.includes("Robo_ArmPivot_")) {
            rig.roboArms.push({ obj: c, idx: parseInt(n.split("_").pop(), 10) || 0 });
          } else if (n.startsWith("SnakeSeg_")) {
            const idx = parseInt(n.split("_").pop(), 10) || 0;
            rig.snakeSegs.push({ obj: c, idx, baseX: c.position.x, baseY: c.position.y });
          } else if (n.includes("MagicRing_")) {
            rig.magicRings.push(c);
          }
        });
        rig.snakeSegs.sort((a, b) => a.idx - b.idx);
        root.userData.rig = rig;
        return rig;
      }

      function updateLifelikeMonster(root, dt, t, playerObj) {
        if (!root || !root.visible) return;
        const rig = getMonsterRig(root);
        const safeDt = Math.max(dt, 0.001);
        const vx = (root.position.x - rig.prevX) / safeDt;
        const vz = (root.position.z - rig.prevZ) / safeDt;
        const rawSpeed = Math.hypot(vx, vz);
        rig.prevX = root.position.x;
        rig.prevZ = root.position.z;

        // Smooth speed blend (0 = standing/caged idle, 1 = full walk/run/chase/follow!)
        rig.smoothSpeed = THREE.MathUtils.lerp(rig.smoothSpeed, Math.min(rawSpeed / 2.2, 1.4), 0.16);
        const moveBlend = Math.min(rig.smoothSpeed, 1.0);
        const isMoving = moveBlend > 0.08;

        // Advance personal walk/idle phase smoothly
        const key = root.name || "";
        const freq = key.includes("Zombie") || key.includes("Mummy") ? 6.5 :
                     key.includes("BoneBreaker") || key.includes("Frankenstein") ? 7.2 :
                     key.includes("Spider") ? 16.0 :
                     key.includes("Clown") ? 11.5 : 9.5;
        rig.phase += dt * (2.2 + moveBlend * freq);
        const ph = rig.phase;

        // When moving (including following player after capture!), face direction of travel naturally
        if (rawSpeed > 0.35 && !key.includes("Eyeball")) {
          const targetYaw = Math.atan2(vx, vz);
          let diff = targetYaw - root.rotation.y;
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          root.rotation.y += diff * Math.min(1, dt * 8.0);
        }

        // 1) BIPED LOCOMOTION + ALIVE IDLE BREATHING (Clown, LaserGuy, Vampire, Skeleton, Frank, Zombie, Mummy, Pumpkin, Werewolf, BoneBreaker, Robot)
        if (rig.hipL && rig.hipR) {
          const stride = Math.sin(ph) * (0.68 * moveBlend);
          rig.hipL.rotation.x = stride;
          rig.hipR.rotation.x = -stride;
        }
        if (rig.shL && rig.shR) {
          const isOutstretched = key.includes("Zombie") || key.includes("Mummy");
          const isHammerBoss = key.includes("BoneBreaker");
          const idleArm = Math.sin(t * 2.2 + rig.phase * 0.1) * 0.08;
          const armSwing = Math.sin(ph) * (0.58 * moveBlend);
          if (isOutstretched) {
            rig.shL.rotation.x = -0.15 + Math.sin(t * 2.8) * 0.12 + armSwing * 0.35;
            rig.shR.rotation.x = -0.15 + Math.cos(t * 2.8) * 0.12 - armSwing * 0.35;
            rig.shL.rotation.z = Math.sin(t * 2.2) * 0.06;
            rig.shR.rotation.z = -Math.sin(t * 2.2) * 0.06;
          } else if (isHammerBoss) {
            rig.shL.rotation.x = -armSwing * 0.8 + idleArm;
            // Heft & swing the massive Bone-Breaker warhammer!
            rig.shR.rotation.x = armSwing * 0.65 + Math.sin(t * 2.6) * 0.14;
          } else {
            rig.shL.rotation.x = -armSwing + idleArm;
            rig.shR.rotation.x = armSwing - idleArm;
            rig.shL.rotation.z = 0.05 + Math.sin(t * 2.0) * 0.04;
            rig.shR.rotation.z = -0.05 - Math.sin(t * 2.0) * 0.04;
          }
        }

        // 2) TORSO BREATHING, WEIGHT-SHIFT SWAY & DOUBLE-FREQUENCY WALK BOUNCE
        if (rig.torso) {
          const breathe = Math.sin(t * 2.6 + root.id) * 0.032;
          const walkBounce = Math.abs(Math.sin(ph)) * 0.11 * moveBlend;
          rig.torso.position.y = rig.baseTorsoY + breathe + walkBounce;
          rig.torso.rotation.y = Math.sin(ph) * 0.14 * moveBlend + Math.sin(t * 1.4 + root.id) * 0.06 * (1 - moveBlend);
          rig.torso.rotation.z = Math.cos(ph) * 0.06 * moveBlend + Math.sin(t * 1.8 + root.id) * 0.035;
          rig.torso.rotation.x = 0.08 * moveBlend;
        }

        // 3) HEAD TRACKING (Looks toward Blake when nearby + curious idle head tilt!)
        if (rig.head) {
          let lookYaw = Math.sin(t * 1.5 + root.id) * 0.22;
          if (playerObj) {
            const dxP = playerObj.position.x - root.position.x;
            const dzP = playerObj.position.z - root.position.z;
            if (Math.hypot(dxP, dzP) < 11.0) {
              const worldYaw = Math.atan2(dxP, dzP);
              let rel = worldYaw - root.rotation.y;
              while (rel > Math.PI) rel -= Math.PI * 2;
              while (rel < -Math.PI) rel += Math.PI * 2;
              lookYaw = THREE.MathUtils.clamp(rel, -0.75, 0.75);
            }
          }
          rig.head.rotation.y = THREE.MathUtils.lerp(rig.head.rotation.y, lookYaw, 0.10);
          rig.head.rotation.z = Math.sin(t * 2.1 + root.id) * 0.08;
        }

        // 4) QUADRUPED (Cat) — 4-Leg Trot + Wagging Tail
        if (rig.quadLegs.length > 0) {
          const qSwing = Math.sin(ph * 1.1) * (0.65 * moveBlend);
          for (const ql of rig.quadLegs) {
            ql.obj.rotation.x = ql.isDiagA ? qSwing : -qSwing;
          }
        }
        if (rig.tail) {
          rig.tail.rotation.z = Math.sin(t * (4.0 + moveBlend * 5.0) + root.id) * 0.42;
          rig.tail.rotation.x = Math.sin(t * 2.5) * 0.12;
        }

        // 5) 8-ARM ELECTRIC ROBOT — All 8 Arms Flexing & Crackling Independently!
        if (rig.roboArms.length > 0) {
          for (const ra of rig.roboArms) {
            const wave = Math.sin(t * (4.5 + moveBlend * 4.5) + ra.idx * 0.85);
            ra.obj.rotation.x = wave * (0.28 + 0.22 * moveBlend);
            ra.obj.rotation.z = Math.cos(t * 3.8 + ra.idx * 1.1) * 0.18;
          }
        }

        // 6) SPIDER — 8-Leg Alternating Wave Skitter (alive idle twitch + fast skitter!)
        if (rig.spiderLegs.length > 0) {
          for (const sl of rig.spiderLegs) {
            const amp = 0.12 + 0.45 * moveBlend;
            const sWave = Math.sin(ph + sl.idx * 1.55) * amp;
            sl.obj.rotation.z = sWave * 0.65;
            sl.obj.rotation.y = sl.baseRotY + Math.cos(ph + sl.idx * 1.55) * amp * 0.5;
          }
        }

        // 7) WINGED FLYERS (Bat, Flying Pumpkin) — Rapid Flapping + Idle Wing Breathing
        if (rig.wingL && rig.wingR) {
          const flapSpeed = isMoving ? 15.0 : 8.5;
          const flapAmp = isMoving ? 0.72 : 0.42;
          const flap = Math.sin(t * flapSpeed + root.id) * flapAmp;
          rig.wingL.rotation.z = flap;
          rig.wingR.rotation.z = -flap;
        }

        // 8) RAINBOW SNAKE — True Sinusoidal S-Curve Slithering across all 12 segments!
        if (rig.snakeSegs.length > 0) {
          const slitherAmp = 0.22 + 0.34 * moveBlend;
          const slitherSpd = 3.5 + 4.5 * moveBlend;
          for (const seg of rig.snakeSegs) {
            const wave = Math.sin(t * slitherSpd - seg.idx * 0.58);
            seg.obj.position.x = seg.baseX + wave * slitherAmp * (0.35 + seg.idx * 0.08);
            seg.obj.rotation.y = Math.cos(t * slitherSpd - seg.idx * 0.58) * 0.28;
            if (seg.idx === 0) {
              seg.obj.position.y = seg.baseY + Math.sin(t * 3.0) * 0.08;
            }
          }
        }

        // 9) SLIME GUY — Squash-and-Stretch Gelatinous Hop & Jiggle!
        if (key === "Monster_SlimeGuy") {
          const hop = Math.sin(t * (4.5 + moveBlend * 4.0));
          const stretch = 1.0 + hop * (0.12 + 0.16 * moveBlend);
          const squash = 1.0 / Math.sqrt(Math.max(0.5, stretch));
          root.scale.set(squash, stretch, squash);
        }

        // 10) MAGICAL EYEBALL & SHADOW GUY — Orbiting Magic Rings & Sparks!
        for (let i = 0; i < rig.magicRings.length; i++) {
          rig.magicRings[i].rotation.y = t * (i % 2 === 0 ? 2.4 : -3.1);
          rig.magicRings[i].rotation.z = Math.sin(t * 1.8 + i) * 0.35;
        }
      }

      const objectiveEl = document.getElementById("objective");
      const actionPromptEl = document.getElementById("action-prompt");
      const moneyHudEl = document.getElementById("money-hud");
      const minimapCanvas = document.getElementById("minimap");
      const mapCtx = minimapCanvas.getContext("2d");

      const cageBeacon = new THREE.Mesh(

      scene.add(cageBeacon);

      function getActiveTargetInfo() {
        // Returns { monsterObj, monsterLabel, cagePos, cageLabel, isCaptured }
        if (!clownInCage && clown) return { monsterObj: clown, monsterLabel: "🤡 Clown", cagePos: firstPodPos, cageLabel: "Lab Cage 1", isCaptured: clownCaptured };
        if (!laserInCage && laserGuy) return { monsterObj: laserGuy, monsterLabel: "🤖 Laser Guy", cagePos: secondPodPos, cageLabel: "Lab Cage 2", isCaptured: laserCaptured };
        if (!slimeInCage && slimeGuy) return { monsterObj: slimeGuy, monsterLabel: "🟢 Slime Guy", cagePos: thirdPodPos, cageLabel: "Lab Cage 3", isCaptured: slimeCaptured };
        if (!allLabMonstersCaged && labQueueIdx < labMonsterDefs.length) {
          const d = labMonsterDefs[labQueueIdx];
          return { monsterObj: d.obj, monsterLabel: d.label, cagePos: d.podPos, cageLabel: `Lab Cage ${d.podIdx + 1}`, isCaptured: activeLabCaptured };
        }
        if (!shadowInCage && shadowGuy) return { monsterObj: shadowGuy, monsterLabel: "👻 Flying Shadow Guy", cagePos: rareCagePos, cageLabel: "House Rare Cage 1", isCaptured: shadowCaptured };
        if (!ghostInCage && ghostGuy) return { monsterObj: ghostGuy, monsterLabel: "👻💨 Teleporting Ghost", cagePos: rareCage2Pos, cageLabel: "House Rare Cage 2", isCaptured: ghostCaptured };
        if (!allBossesCaged && bossIdx < houseBossDefs.length) {

          return { monsterObj: b.obj, monsterLabel: b.label, cagePos: b.cagePos, cageLabel: `House Boss Cage ${b.cageIdx + 1}`, isCaptured: activeBossCaptured };

      }

      function drawMinimap() {
        if (!player || !mapCtx) return;
        const w = minimapCanvas.width, h = minimapCanvas.height;
        mapCtx.fillStyle = "#0b1324";
        mapCtx.fillRect(0, 0, w, h);

        // Map world coordinates (X: -60..60, Z: -30..105) -> canvas
        const toX = (wx) => ((wx + 60) / 120) * w;
        const toY = (wz) => ((wz + 30) / 135) * h;

        // Draw Lab (top), Dark Room (center-top), Forest (bottom), House (left forest)
        mapCtx.fillStyle = "#1e3a2f";
        mapCtx.fillRect(toX(-12), toY(-26), toX(12) - toX(-12), toY(-4) - toY(-26)); // Lab
        mapCtx.fillStyle = "#334155";
        mapCtx.fillRect(toX(-5), toY(-4), toX(5) - toX(-5), toY(4) - toY(-4)); // Dark Room
        mapCtx.fillStyle = "#14532d";
        mapCtx.fillRect(toX(-55), toY(4), toX(55) - toX(-55), toY(100) - toY(4)); // Forest
        mapCtx.fillStyle = "#92400e";
        mapCtx.fillRect(toX(-14.5), toY(23.5), toX(-5.5) - toX(-14.5), toY(32.5) - toY(23.5)); // House

        // Draw Active Target Monster (pulsing RED) or Target Cage (pulsing GREEN)!
        const info = getActiveTargetInfo();
        const pulse = 4 + Math.sin(clock.elapsedTime * 8) * 1.8;
        if (info) {
          if (info.isCaptured && info.cagePos) {
            mapCtx.fillStyle = "#22c55e";
            mapCtx.beginPath();
            mapCtx.arc(toX(info.cagePos.x), toY(info.cagePos.z), pulse, 0, Math.PI * 2);
            mapCtx.fill();
            cageBeacon.visible = true;
            cageBeacon.position.set(info.cagePos.x, 3.4 + Math.sin(clock.elapsedTime * 5) * 0.35, info.cagePos.z);
          } else if (info.monsterObj && info.monsterObj.visible) {
            mapCtx.fillStyle = "#ef4444";
            mapCtx.beginPath();
            mapCtx.arc(toX(info.monsterObj.position.x), toY(info.monsterObj.position.z), pulse, 0, Math.PI * 2);
            mapCtx.fill();
            cageBeacon.visible = false;
          } else {
            cageBeacon.visible = false;
          }
        } else {
          cageBeacon.visible = false;
        }

        // Draw Player (bright BLUE dot)
        mapCtx.fillStyle = "#38bdf8";
        mapCtx.beginPath();
        mapCtx.arc(toX(player.position.x), toY(player.position.z), 4.5, 0, Math.PI * 2);
        mapCtx.fill();
        mapCtx.strokeStyle = "#ffffff";
        mapCtx.lineWidth = 1.5;
        mapCtx.stroke();
      }

      // Rich Web Audio API Sound Effects ("a lot of noise!")
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      let ambientSoundTimer = 0;

      function playTone(freq, duration, type = "sine", vol = 0.14) {
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      }
      function playNoiseBurst(duration = 0.15, vol = 0.12) {
        if (audioCtx.state === "suspended") audioCtx.resume();
        const bufferSize = Math.floor(audioCtx.sampleRate * duration);
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
        const src = audioCtx.createBufferSource();
        src.buffer = buffer;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        src.connect(gain);
        gain.connect(audioCtx.destination);
        src.start();
      }
      function playSpookyForestNoise() {
        const pick = Math.floor(Math.random() * 4);
        if (pick === 0) {
          // Spooky ghost woo-ooo
          playTone(340, 0.45, "sine", 0.08);
          setTimeout(() => playTone(280, 0.55, "sine", 0.07), 220);
        } else if (pick === 1) {
          // Creaky floorboard / tree branch
          playTone(130, 0.22, "sawtooth", 0.06);
          setTimeout(() => playTone(105, 0.28, "sawtooth", 0.05), 140);
        } else if (pick === 2) {
          // Distant monster growl / wind whoosh
          playNoiseBurst(0.35, 0.08);
          playTone(75, 0.4, "triangle", 0.09);
        } else {
          // Clown honk / eerie ping
          playTone(580, 0.12, "square", 0.06);
          setTimeout(() => playTone(460, 0.16, "square", 0.06), 130);
        }
      }

              obj.position.y = 3.0;
              obj.rotation.set(0, 0, 0);
            }
            if (!obj.isMesh) return;
            obj.castShadow = !obj.name.includes("Floor") && !obj.name.includes("Ground");
            obj.receiveShadow = true;
            const n = obj.name;
            let category = null;
            if (n.includes("Wall") && !n.includes("Top")) category = "wall";
            else if (n.includes("Trunk")) category = "tree";
            else if (n.startsWith("Pod_Base_") || n.startsWith("House_Cage_Base_") || n.startsWith("Forest_Rock_") || n.startsWith("Lab_Table_") || n.startsWith("Abandoned_Crate_") || n.startsWith("Borrow_Money_Desk")) {
              category = "object";
            }
            if (category) {
              const box = new THREE.Box3().setFromObject(obj);
              colliders.push({ name: n, category, box, mesh: obj, active: true });
            }
          });
          if (podCap0) {
            podCap0.position.set(firstPodPos.x + 1.2, 0.35, firstPodPos.z + 1.4);

          // Expose test hooks for automated collision & gameplay verification

              name: c.name,

              min: { x: c.box.min.x, z: c.box.min.z },
              max: { x: c.box.max.x, z: c.box.max.z },

          if (player) {

          }

          // Built-in automated collision & house test suite when ?autotest=1 or ?test=house

          if (params.get("autotest") === "1" || params.get("test") === "house") {
            const results = [];

              player.position.set(cx, 0, pod.box.max.z + 1.2);
              for (let i = 0; i < 40; i++) movePlayer(0, -1, 0.05);
              podPass = player.position.z > cz;
            }
            results.push({ name: "Blocks Solid Objects", pass: podPass });

            // Test 5: Can Exit Dark Room into Lab, Exit into Forest, & Enter/Exit House
            const craftObj = gltf.scene.getObjectByName("Cabin_Crafting_Table");
            const portalObj = gltf.scene.getObjectByName("Cabin_Teleporter_Portal");
            const cabinDoorObj = gltf.scene.getObjectByName("Cabin_Door");
            const laserObj = gltf.scene.getObjectByName("Monster_LaserGuy");
            // Walk out of Dark Room into Lab through left doorway (x = -2.2)
            player.position.set(-2.2, 0, 1.5);
            for (let i = 0; i < 30; i++) movePlayer(0, -1, 0.05);
            const exitedToLab = player.position.z < -5.0;
            // Walk out of Dark Room into Forest through left outside doorway (x = -2.2)

            const exitedToForest = player.position.z > 6.0;
            // Enter & Exit Bigger 9x9 House (doorway at z = 23.6)
            player.position.set(-10.0, 0, 22.0);
            for (let i = 0; i < 25; i++) movePlayer(0, 1, 0.05);
            const enteredHouse = player.position.z > 24.8;
            for (let i = 0; i < 25; i++) movePlayer(0, -1, 0.05);
            const exitedHouse = player.position.z < 22.5;
            results.push({ name: "Never Stuck (Can Exit Room & House)", pass: Boolean(exitedToLab && exitedToForest && enteredHouse && exitedHouse) });
            results.push({ name: "House Door + Crafting Table + Portal + 3 Cages", pass: Boolean(craftObj && portalObj && cabinDoorObj && gltf.scene.getObjectByName("House_Cage_Base_0")) });
            results.push({ name: "Red Laser Guy Far Away in Forest", pass: Boolean(laserObj && laserObj.position.z > 40) });
            results.push({ name: "Real-Time Shadows + ACES ToneMapping", pass: Boolean(renderer.shadowMap.enabled && renderer.toneMapping === THREE.ACESFilmicToneMapping) });
            results.push({ name: "PMREM IBL Metallic Reflections", pass: Boolean(scene.environment) });
            results.push({ name: "Bloom Post-Processing + 260 Fireflies", pass: Boolean(bloomEnabled && PARTICLE_COUNT >= 200) });
            results.push({ name: "3D Hip/Shoulder Walk Pivots + Mixer", pass: Boolean(legL && legR && legL.name.includes("HipPivot")) });
            const allMonstersForTest = [clown, laserGuy, slimeGuy, shadowGuy, ghostGuy, ...labMonsterDefs.map((d) => d.obj), ...houseBossDefs.map((b) => b.obj)].filter(Boolean);
            const riggedCount = allMonstersForTest.filter((m) => {
              const r = getMonsterRig(m);
              return Boolean(r.torso || r.head || r.hipL || r.wingL || r.snakeSegs.length > 0 || r.roboArms.length > 0 || r.spiderLegs.length > 0);
            }).length;
            results.push({ name: `Lifelike Articulated Monster Rigs (${riggedCount}/${allMonstersForTest.length})`, pass: riggedCount === allMonstersForTest.length && riggedCount >= 18 });

            // Restore player (or stay in House if ?test=house)
            if (new URLSearchParams(window.location.search).get("test") === "house") {
              level = 2;

            const allPass = results.every((r) => r.pass);
            const badge = document.createElement("div");

              "position:fixed;bottom:16px;right:16px;background:rgba(15,23,42,0.92);color:#f8fafc;border:2px solid " +

              `<br><small>Colliders: ${colliders.length} (${colliders.filter(c=>c.category==="wall").length} walls, ${colliders.filter(c=>c.category==="tree").length} trees, ${colliders.filter(c=>c.category==="object").length} objects)</small>`;

      // Input: Keyboard + Mouse Click/Drag to Walk
      const keys = {};
      let mouseTarget = null;

      const raycaster = new THREE.Raycaster();

      const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

      function updateMouseTarget(clientX, clientY) {
        pointer.x = (clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(clientY / window.innerHeight) * 2 + 1;

      renderer.domElement.addEventListener("pointerdown", (e) => {

      function handleAction() {

        // 2. Level 2: Throw Clown into First Cage
        const distPod = Math.hypot(player.position.x - firstPodPos.x, player.position.z - firstPodPos.z);
        if (clownCaptured && !clownInCage && !throwingClown && distPod < 5.0 && clown) {
          throwingClown = true;
          throwProgress = 0;
          throwStartPos.copy(clown.position);
          actionPromptEl.style.display = "none";
          playTone(350, 0.2, "sine", 0.2);
          return;
        }

        // 3. At Clown's First Cage: Take $10 for free!
        if (clownInCage && !borrowedMoney && distPod < 5.0) {

          money += 10;
          moneyHudEl.textContent = `💰 $${money}`;

          return;
        }

        // 4. Inside Bigger 9x9 Abandoned House: Pay $10, Craft Tool, Put Laser Guy in Cage, or Teleport!
        const inCabin =
          player.position.x > -14.5 &&
          player.position.x < -5.5 &&
          player.position.z > 23.5 &&
          player.position.z < 32.5;

        if (clownInCage && inCabin && borrowedMoney && !paidForMoreRoom && money >= 10) {

        // Throw captured Laser Guy into Pod 2 (right next to the Clown in the Lab!)

        if (clownInCage && craftTableObj) {

      function collidesAt(x, z) {
        for (let i = 0; i < colliders.length; i++) {
          if (!colliders[i].active) continue;
          const b = colliders[i].box;
          if (
            x + PLAYER_RADIUS > b.min.x &&
            x - PLAYER_RADIUS < b.max.x &&
            z + PLAYER_RADIUS > b.min.z &&
            z - PLAYER_RADIUS < b.max.z
          ) {
            return true;
          }
        }
        return false;
      }

      function toggleNearestDoor() {
        if (!player) return false;
        let best = null;
        let bestDist = 3.6;
        const pos = new THREE.Vector3();
        for (const d of doorPivots) {
          d.obj.getWorldPosition(pos);
          const dist = Math.hypot(player.position.x - pos.x, player.position.z - pos.z);
          if (dist < bestDist) {
            bestDist = dist;
            best = d;
          }
        }
        if (best) {
          best.isOpen = !best.isOpen;
          best.obj.rotation.y = best.isOpen ? best.openAngle : best.closedAngle;
          playTone(best.isOpen ? 320 : 180, 0.12, "square", 0.12);
          return true;
        }
        return false;
      }

      function findChoppableNearPlayer() {
        if (!player) return null;
        let best = null;
        let bestDist = 2.8;
        for (const c of colliders) {
          if (!c.active) continue;
          if (c.category !== "tree" && !c.name.startsWith("Forest_Rock_")) continue;
          const cx = (c.box.min.x + c.box.max.x) / 2;
          const cz = (c.box.min.z + c.box.max.z) / 2;
          const dist = Math.hypot(player.position.x - cx, player.position.z - cz);
          if (dist < bestDist) {
            bestDist = dist;
            best = c;
          }
        }
        return best;
      }

      function movePlayer(dx, dz, dt) {
        const speed = 6.5;
        const len = Math.hypot(dx, dz);
        if (len === 0) return;
        const nx = dx / len;
        const nz = dz / len;

        // Flip human forward! (In glTF from Blender, face & flashlight are on local -Z)
        player.rotation.y = Math.atan2(-nx, -nz);

        const maxZ = 195.0;
        const maxX = player.position.z > 4.0 ? 95.0 : 11.3;

        const nextX = THREE.MathUtils.clamp(player.position.x + nx * speed * dt, -maxX, maxX);
        if (!collidesAt(nextX, player.position.z)) {
          player.position.x = nextX;
        }
        const nextZ = THREE.MathUtils.clamp(player.position.z + nz * speed * dt, -25.3, maxZ);
        if (!collidesAt(player.position.x, nextZ)) {
          player.position.z = nextZ;
        }
      }

      const clock = new THREE.Clock();
      const flashWorldPos = new THREE.Vector3();

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);

        if (!player) {
          composer.render();
          return;
        }

        // Movement
        let dx = 0;
        let dz = 0;
        if (keys["KeyW"] || keys["ArrowUp"]) dz -= 1;
        if (keys["KeyS"] || keys["ArrowDown"]) dz += 1;
        if (keys["KeyA"] || keys["ArrowLeft"]) dx -= 1;
        if (keys["KeyD"] || keys["ArrowRight"]) dx += 1;

        if (dx === 0 && dz === 0 && mouseTarget) {
          const mdx = mouseTarget.x - player.position.x;
          const mdz = mouseTarget.z - player.position.z;
          if (Math.hypot(mdx, mdz) > 0.25) {
            dx = mdx;
            dz = mdz;
          } else {
            mouseTarget = null;
          }
        }

        if (dx !== 0 || dz !== 0) {
          movePlayer(dx, dz, dt);
          walkTime += dt * 10;
          const swing = Math.sin(walkTime) * 0.55;
          if (legL) legL.rotation.x = swing;
          if (legR) legR.rotation.x = -swing;
          if (armL) armL.rotation.x = -swing * 0.8;
          if (armR) armR.rotation.x = 0.96 + swing * 0.2;
          stepTimer += dt;
          if (stepTimer > 0.28) {
            playFootstep();
            stepTimer = 0;
          }
        } else {
          if (legL) legL.rotation.x *= 0.8;
          if (legR) legR.rotation.x *= 0.8;
          if (armL) armL.rotation.x *= 0.8;
        }

        // Update Flashlight beam directly from the flashlight in his hand pointing forward (-Z local)
        const forwardX = -Math.sin(player.rotation.y);
        const forwardZ = -Math.cos(player.rotation.y);
        if (flashlightMesh) {
          flashlightMesh.getWorldPosition(flashWorldPos);
          flashlight.position.copy(flashWorldPos);
        } else {
          flashlight.position.set(player.position.x, player.position.y + 1.3, player.position.z);
        }
        flashlightTarget.position.set(
          flashlight.position.x + forwardX * 8,
          flashlight.position.y - 0.6,
          flashlight.position.z + forwardZ * 8
        );

        // Laser Guy ONLY active after Clown is caged! Once captured/caged, NO lasers!
        if (laserBeam && (laserCaptured || laserInCage || !clownInCage)) {
          laserBeam.visible = false;
        }
        if (laserGuy && laserBeam && clownInCage && !laserInCage && !throwingLaser) {
          laserGuy.visible = true;
          if (laserCaptured) {
            const tx = player.position.x - forwardX * 1.8;
            const tz = player.position.z - forwardZ * 1.8;
            const moveDist = Math.hypot(tx - laserGuy.position.x, tz - laserGuy.position.z);
            laserGuy.position.x += (tx - laserGuy.position.x) * 0.1;
            laserGuy.position.z += (tz - laserGuy.position.z) * 0.1;
            laserBeam.visible = false;
          } else {
            const dxL = player.position.x - laserGuy.position.x;
            const dzL = player.position.z - laserGuy.position.z;
            const distL = Math.hypot(dxL, dzL);
            if (distL < 2.2) {
              laserCaptured = true;
              laserBeam.visible = false;
              playChime();
              objectiveEl.textContent = "🤖 You caught the Laser Guy! Bring him to Lab Pod 2 (next to the Clown) and throw him in!";
            } else if (distL < 18.0) {
              laserGuy.rotation.y = Math.atan2(dxL, dzL);
              laserTimer += dt;
              if (laserTimer > 2.0) {
                laserTimer = 0;
                laserActive = 0.35;
                laserBeam.position.set(laserGuy.position.x, 1.35, laserGuy.position.z);
                laserBeam.rotation.y = laserGuy.rotation.y;
                laserBeam.visible = true;
                playTone(180, 0.25, "sawtooth", 0.2);
                if (distL < 15.0) {
                  player.position.x += (dxL / distL) * 1.6;
                  player.position.z += (dzL / distL) * 1.6;
                  objectiveEl.textContent = "⚡ Zapped by Laser Guy! Dodge & catch him!";
                }
              }
            } else {
              laserGuy.rotation.y += dt * 0.8;
            }
            if (laserActive > 0) {
              laserActive -= dt;
              if (laserActive <= 0) laserBeam.visible = false;
            }
          }
        }

        // Slime Guy ONLY active after Laser Guy is caged!
        if (slimeGuy && laserInCage && !slimeInCage && !throwingSlime) {
          slimeGuy.visible = true;
          if (slimeCaptured) {
            const tx = player.position.x - forwardX * 2.0;
            const tz = player.position.z - forwardZ * 2.0;
            slimeGuy.position.x += (tx - slimeGuy.position.x) * 0.1;
            slimeGuy.position.z += (tz - slimeGuy.position.z) * 0.1;
          } else {
            const dxS = slimeGuy.position.x - player.position.x;
            const dzS = slimeGuy.position.z - player.position.z;
            const distS = Math.hypot(dxS, dzS);
            if (distS < 8.5 && distS >= 2.2) {
              player.position.x += (dxS / distS) * 2.2 * dt;
              player.position.z += (dzS / distS) * 2.2 * dt;
              objectiveEl.textContent = "🟢 WHOA! The Slime Guy is trying to suck you up! Catch him!";
            }
            if (distS < 2.2) {
              slimeCaptured = true;
              playChime();
              objectiveEl.textContent = "🟢 You caught the Slime Guy! Bring him to Lab Pod 3 (next to Laser Guy) and throw him in!";
            }
          }
        }

        // 9 Lab Queue Monsters (Vampire -> Witch -> Pumpkin -> Cat -> Bat -> Spider -> Skeleton -> Eyeball -> Robot)
        if (slimeInCage && !allLabMonstersCaged && labQueueIdx < labMonsterDefs.length) {
          const def = labMonsterDefs[labQueueIdx];
          if (def && def.obj) {
            def.obj.visible = true;
            if (def.flies && !activeLabThrowing) {
              def.obj.position.y = 1.9 + Math.sin(clock.elapsedTime * 5) * 0.35;
              if (def.key === "Monster_Bat") {
                const wl = def.obj.getObjectByName("Bat_WingPivot_L");
                const wr = def.obj.getObjectByName("Bat_WingPivot_R");
                const flap = Math.sin(clock.elapsedTime * 14) * 0.65;
                if (wl) wl.rotation.z = flap;
                if (wr) wr.rotation.z = -flap;
              }
            }
            if (activeLabThrowing) {
              throwProgress += dt * 1.6;
              const t = Math.min(throwProgress, 1.0);
              def.obj.position.x = THREE.MathUtils.lerp(throwStartPos.x, def.podPos.x, t);
              def.obj.position.z = THREE.MathUtils.lerp(throwStartPos.z, def.podPos.z, t);
              def.obj.position.y = Math.sin(t * Math.PI) * 2.5 + (def.flies ? 0.8 : 0.2) * t;
              if (t >= 1.0) {
                activeLabThrowing = false;
                activeLabCaptured = false;
                money += 10;
                updateHudStats();
                playChime();
                labQueueIdx += 1;
                if (labQueueIdx < labMonsterDefs.length) {
                  const nextDef = labMonsterDefs[labQueueIdx];
                  if (nextDef.obj) nextDef.obj.visible = true;
                  objectiveEl.textContent = `${def.label} caged (+$10)! Next up: go catch the ${nextDef.label} in the forest!`;
                } else {
                  allLabMonstersCaged = true;
                  if (shadowGuy) shadowGuy.visible = true;
                  objectiveEl.textContent = "🎉 ALL LAB MONSTERS CAGED! Now catch the RARE FLYING SHADOW GUY for your House!";
                }
              }
            } else if (activeLabCaptured) {
              const tx = player.position.x - forwardX * 2.0;
              const tz = player.position.z - forwardZ * 2.0;
              def.obj.position.x += (tx - def.obj.position.x) * 0.1;
              def.obj.position.z += (tz - def.obj.position.z) * 0.1;
            } else {
              const dxM = player.position.x - def.obj.position.x;
              const dzM = player.position.z - def.obj.position.z;
              const distM = Math.hypot(dxM, dzM);
              if (distM < 10.0 && distM >= 2.2) {
                // Spider jumps down from the tree when you get close!
                if (def.key === "Monster_Spider" && def.obj.position.y > 0.05) {
                  def.obj.position.y = Math.max(0, def.obj.position.y - 6.0 * dt);
                  objectiveEl.textContent = "🕷️ WHOA! The Spider JUMPED DOWN from the tree to get you!";
                }
                def.obj.position.x += (dxM / distM) * 2.4 * dt;
                def.obj.position.z += (dzM / distM) * 2.4 * dt;
                def.obj.rotation.y = Math.atan2(dxM, dzM);
              }
              if (distM < 2.2) {
                activeLabCaptured = true;
                playChime();
                objectiveEl.textContent = `You caught the ${def.label}! Bring it to Lab Pod ${def.podIdx + 1} and press SPACEBAR to throw it in!`;
              }
            }
          }
        }

        // RARE FLYING Shadow Guy ONLY active after ALL Lab Monsters are caged! Flies in the air with swaying motion!
        if (shadowGuy && allLabMonstersCaged && !shadowInCage && !throwingShadow) {
          shadowGuy.visible = true;
          shadowGuy.position.y = 1.6 + Math.sin(clock.elapsedTime * 4) * 0.35;
          shadowGuy.rotation.z = Math.sin(clock.elapsedTime * 3.5) * 0.14;
          if (shadowCaptured) {
            const tx = player.position.x - forwardX * 2.0;
            const tz = player.position.z - forwardZ * 2.0;
            shadowGuy.position.x += (tx - shadowGuy.position.x) * 0.1;
            shadowGuy.position.z += (tz - shadowGuy.position.z) * 0.1;
          } else {
            const dxSh = player.position.x - shadowGuy.position.x;
            const dzSh = player.position.z - shadowGuy.position.z;
            const distSh = Math.hypot(dxSh, dzSh);
            if (distSh < 12.0 && distSh >= 2.2) {
              shadowGuy.position.x += (dxSh / distSh) * 3.0 * dt;
              shadowGuy.position.z += (dzSh / distSh) * 3.0 * dt;
              shadowGuy.rotation.y = Math.atan2(dxSh, dzSh);
              objectiveEl.textContent = "👻 FLYING SHADOW GUY is swooping at you! Catch him for your House Cage!";
            }
            if (distSh < 2.2) {
              shadowCaptured = true;
              playChime();
              objectiveEl.textContent = "👻 You caught the FLYING SHADOW GUY! Bring him to House Cage 1 and throw him in!";
            }
          }
        }

        // TELEPORTING GHOST ONLY active after Shadow Guy is caged! Goes into House Cage 2!
        if (ghostGuy && shadowInCage && !ghostInCage && !throwingGhost) {
          ghostGuy.visible = true;
          ghostGuy.position.y = 1.4 + Math.sin(clock.elapsedTime * 3.5) * 0.3;
          if (ghostCaptured) {
            const tx = player.position.x - forwardX * 2.0;
            const tz = player.position.z - forwardZ * 2.0;
            ghostGuy.position.x += (tx - ghostGuy.position.x) * 0.1;
            ghostGuy.position.z += (tz - ghostGuy.position.z) * 0.1;
          } else {
            const dxG = player.position.x - ghostGuy.position.x;
            const dzG = player.position.z - ghostGuy.position.z;
            const distG = Math.hypot(dxG, dzG);
            if (distG < 14.0 && distG >= 2.2) {
              ghostTeleportTimer += dt;
              if (ghostTeleportTimer > 2.8) {
                ghostTeleportTimer = 0;
                const ang = Math.random() * Math.PI * 2;
                ghostGuy.position.x = THREE.MathUtils.clamp(player.position.x + Math.cos(ang) * 7.5, -80, 80);
                ghostGuy.position.z = THREE.MathUtils.clamp(player.position.z + Math.sin(ang) * 7.5, 10, 180);
                playTone(620, 0.2, "sine", 0.14);
                objectiveEl.textContent = "👻💨 The Ghost TELEPORTED! Track him down with your flashlight!";
              }
            }
            if (distG < 2.2) {
              ghostCaptured = true;
              playChime();
              objectiveEl.textContent = "👻💨 You caught the TELEPORTING GHOST! Bring him to House Cage 2 and throw him in!";
            }
          }
        }

        // Level 1: Enter Lab
        if (level === 1 && !visitedLab && player.position.z < -4.5) {
          visitedLab = true;
          playTone(220, 0.3, "sawtooth", 0.12);
          objectiveEl.textContent = "Whoa! Go back to the Dark Room and turn on the yellow Light Switch!";
        }

        // Level 2: Enter Forest
        if (level === 2 && !outsideEntered && player.position.z > 4.5) {
          outsideEntered = true;
          playTone(220, 0.3, "sawtooth", 0.12);
          objectiveEl.textContent = "🤡 Capture a Clown! Use your flashlight to find him in the forest!";
        }

        // Level 2: Clown tries to scare you, then you catch him
        if (level === 2 && outsideEntered && !clownCaptured && !clownInCage && clown) {
          const dxC = player.position.x - clown.position.x;
          const dzC = player.position.z - clown.position.z;
          const distC = Math.hypot(dxC, dzC);
          if (distC < 8.0 && distC >= 2.2) {
            clown.position.x += (dxC / distC) * 2.0 * dt;
            clown.position.z += (dzC / distC) * 2.0 * dt;
            clown.rotation.y = Math.atan2(dxC, dzC);
            objectiveEl.textContent = "🤡 BOO! The Clown is trying to scare you! Catch him!";
          }
          if (distC < 2.2) {
            clownCaptured = true;
            playChime();
            objectiveEl.textContent = "First cage! Bring the Clown back to the First cage and throw him in!";
          }
        }

        // Clown follows player with moving feet (until thrown!)
        if (clownCaptured && !clownInCage && !throwingClown && clown) {
          const targetX = player.position.x - forwardX * 1.6;
          const targetZ = player.position.z - forwardZ * 1.6;
          const moveDist = Math.hypot(targetX - clown.position.x, targetZ - clown.position.z);
          clown.position.x += (targetX - clown.position.x) * 0.1;
          clown.position.z += (targetZ - clown.position.z) * 0.1;
          if (moveDist > 0.15) {
            const cSwing = Math.sin(clock.elapsedTime * 12) * 0.6;
            if (clownLegL) clownLegL.rotation.x = cSwing;
            if (clownLegR) clownLegR.rotation.x = -cSwing;
          } else {
            if (clownLegL) clownLegL.rotation.x *= 0.8;
            if (clownLegR) clownLegR.rotation.x *= 0.8;
          }
        }

        // Throwing Clown animation
        if (throwingClown && clown) {
          throwProgress += dt * 1.6;
          const t = Math.min(throwProgress, 1.0);
          clown.position.x = THREE.MathUtils.lerp(throwStartPos.x, firstPodPos.x, t);
          clown.position.z = THREE.MathUtils.lerp(throwStartPos.z, firstPodPos.z, t);
          clown.position.y = Math.sin(t * Math.PI) * 2.5 + 0.3 * t;
          if (t >= 1.0) {
            throwingClown = false;
            clownInCage = true;
            if (podCap0) {
              podCap0.position.set(firstPodPos.x, 3.0, firstPodPos.z);
              podCap0.rotation.set(0, 0, 0);
            }
            playChime();
            objectiveEl.textContent = "🏠 The house is unlocked! Go find the abandoned house in the forest!";
          }
        }

        // Throwing animations for Laser Guy, Slime Guy, and RARE Shadow Guy!
        if (throwingLaser && laserGuy) {
          throwProgress += dt * 1.6;
          const t = Math.min(throwProgress, 1.0);
          laserGuy.position.x = THREE.MathUtils.lerp(throwStartPos.x, secondPodPos.x, t);
          laserGuy.position.z = THREE.MathUtils.lerp(throwStartPos.z, secondPodPos.z, t);
          laserGuy.position.y = Math.sin(t * Math.PI) * 2.5 + 0.2 * t;
          if (t >= 1.0) {
            throwingLaser = false;
            laserInCage = true;
            if (slimeGuy) slimeGuy.visible = true;
            playChime();
            objectiveEl.textContent = "🤖 Threw Laser Guy into Lab Pod 2! Now the SLIME GUY is out in the forest!";
          }
        }
        if (throwingSlime && slimeGuy) {
          throwProgress += dt * 1.6;
          const t = Math.min(throwProgress, 1.0);
          slimeGuy.position.x = THREE.MathUtils.lerp(throwStartPos.x, thirdPodPos.x, t);
          slimeGuy.position.z = THREE.MathUtils.lerp(throwStartPos.z, thirdPodPos.z, t);
          slimeGuy.position.y = Math.sin(t * Math.PI) * 2.5 + 0.2 * t;
          if (t >= 1.0) {
            throwingSlime = false;
            slimeInCage = true;
            if (labMonsterDefs[0] && labMonsterDefs[0].obj) labMonsterDefs[0].obj.visible = true;
            playChime();
            objectiveEl.textContent = "🟢 Threw Slime Guy into Lab Pod 3! Next up: go catch the 🧛 Vampire in the forest!";
          }
        }
        if (throwingShadow && shadowGuy) {
          throwProgress += dt * 1.6;
          const t = Math.min(throwProgress, 1.0);
          shadowGuy.position.x = THREE.MathUtils.lerp(throwStartPos.x, rareCagePos.x, t);
          shadowGuy.position.z = THREE.MathUtils.lerp(throwStartPos.z, rareCagePos.z, t);
          shadowGuy.position.y = Math.sin(t * Math.PI) * 2.5 + 0.2 * t;
          if (t >= 1.0) {
            throwingShadow = false;
            shadowInCage = true;
            shadowGuy.rotation.z = 0;
            if (ghostGuy) ghostGuy.visible = true;
            playChime();
            objectiveEl.textContent = "👻 Shadow Guy caged! Now go catch the TELEPORTING GHOST in the forest!";
          }
        }
        if (throwingGhost && ghostGuy) {
          throwProgress += dt * 1.6;
          const t = Math.min(throwProgress, 1.0);
          ghostGuy.position.x = THREE.MathUtils.lerp(throwStartPos.x, rareCage2Pos.x, t);
          ghostGuy.position.z = THREE.MathUtils.lerp(throwStartPos.z, rareCage2Pos.z, t);
          ghostGuy.position.y = Math.sin(t * Math.PI) * 2.5 + 0.5 * t;
          if (t >= 1.0) {
            throwingGhost = false;
            ghostInCage = true;
            if (houseBossDefs[0] && houseBossDefs[0].obj) houseBossDefs[0].obj.visible = true;
            playChime();
            objectiveEl.textContent = "🌈🐍 SUPER-RARE BOSS UNLOCKED! Find the Rainbow Snake deep in the forest!";
          }
        }

        // 3 SUPER-RARE HARD-TO-FIND HOUSE BOSSES (Rainbow Snake -> Flying Pumpkin -> Bone Breaker!)
        if (ghostInCage && !allBossesCaged && bossIdx < houseBossDefs.length) {
          const bdef = houseBossDefs[bossIdx];
          if (bdef && bdef.obj) {
            bdef.obj.visible = true;
            if (bdef.flies && !activeBossThrowing) {
              bdef.obj.position.y = 2.4 + Math.sin(clock.elapsedTime * 6) * 0.5;
              // Crazy Flying Pumpkin zips around in the air!
              if (!activeBossCaptured) {
                bdef.obj.position.x += Math.cos(clock.elapsedTime * 2.2) * 3.5 * dt;
                bdef.obj.position.z += Math.sin(clock.elapsedTime * 2.2) * 3.5 * dt;
              }
            }
            if (activeBossThrowing) {
              throwProgress += dt * 1.6;
              const t = Math.min(throwProgress, 1.0);
              bdef.obj.position.x = THREE.MathUtils.lerp(throwStartPos.x, bdef.cagePos.x, t);
              bdef.obj.position.z = THREE.MathUtils.lerp(throwStartPos.z, bdef.cagePos.z, t);
              bdef.obj.position.y = Math.sin(t * Math.PI) * 2.8 + (bdef.flies ? 0.9 : 0.2) * t;
              if (t >= 1.0) {
                activeBossThrowing = false;
                activeBossCaptured = false;
                money += 50;
                updateHudStats();
                playChime();
                bossIdx += 1;
                if (bossIdx < houseBossDefs.length) {
                  const nb = houseBossDefs[bossIdx];
                  if (nb.obj) nb.obj.visible = true;
                  objectiveEl.textContent = `🏆 ${bdef.label} CAGED (+$50)! Next Super-Rare Boss: ${nb.label}!`;
                } else {
                  allBossesCaged = true;
                  objectiveEl.textContent = "👑🏆 YOU BEAT THE ENTIRE GAME, BLAKE! EVERY SINGLE MONSTER & RARE BOSS CAGED!";
                }
              }
            } else if (activeBossCaptured) {
              const tx = player.position.x - forwardX * 2.2;
              const tz = player.position.z - forwardZ * 2.2;
              bdef.obj.position.x += (tx - bdef.obj.position.x) * 0.1;
              bdef.obj.position.z += (tz - bdef.obj.position.z) * 0.1;
            } else {
              const dxB = player.position.x - bdef.obj.position.x;
              const dzB = player.position.z - bdef.obj.position.z;
              const distB = Math.hypot(dxB, dzB);
              if (distB < 14.0 && distB >= 2.3) {
                bdef.obj.position.x += (dxB / distB) * bdef.speed * dt;
                bdef.obj.position.z += (dzB / distB) * bdef.speed * dt;
                bdef.obj.rotation.y = Math.atan2(dxB, dzB);
              }
              if (distB < 2.3) {
                activeBossCaptured = true;
                playChime();
                objectiveEl.textContent = `🔥 You caught ${bdef.label}! Bring it to House Cage ${bdef.cageIdx + 1} & press SPACEBAR!`;
              }
            }
          }
        }

        // Contextual Action Prompts
        const switchPos = new THREE.Vector3(-4.8, 0, 1.5);
        const distPod = Math.hypot(player.position.x - firstPodPos.x, player.position.z - firstPodPos.z);
        const inCabin =
          player.position.x > -14.5 &&
          player.position.x < -5.5 &&
          player.position.z > 23.5 &&
          player.position.z < 32.5;
        const distCraft = craftTableObj ? Math.hypot(player.position.x - craftTableObj.position.x, player.position.z - craftTableObj.position.z) : 99;
        const distPortal = portalObjRef ? Math.hypot(player.position.x - portalObjRef.position.x, player.position.z - portalObjRef.position.z) : 99;
        const distPod2 = Math.hypot(player.position.x - secondPodPos.x, player.position.z - secondPodPos.z);
        const distPod3 = Math.hypot(player.position.x - thirdPodPos.x, player.position.z - thirdPodPos.z);
        const nearChoppable = clownInCage ? findChoppableNearPlayer() : null;

        if (!clownInCage && inCabin) {
          player.position.z = 23.2;
          objectiveEl.textContent = "🔒 House is LOCKED! Put the Clown in the First cage first!";
        }

        // Universal Throw Prompt for ANY captured monster near its target cage!
        const activeInfo = getActiveTargetInfo();
        const nearActiveCage =
          activeInfo &&
          activeInfo.isCaptured &&
          activeInfo.cagePos &&
          Math.hypot(player.position.x - activeInfo.cagePos.x, player.position.z - activeInfo.cagePos.z) < 5.0;

        const distLadderNow = Math.hypot(player.position.x - ladderPos.x, player.position.z - ladderPos.z);

        if (distLadderNow < 3.0) {
          actionPromptEl.textContent = onLoft ? "🪜 Press SPACEBAR / E to Climb DOWN the Ladder!" : "🪜 Press SPACEBAR / E to Climb UP the Ladder!";
          actionPromptEl.style.display = "block";
        } else if (level === 1 && visitedLab && !lightTurnedOn && player.position.distanceTo(switchPos) < 3.5) {
          actionPromptEl.textContent = "Press SPACEBAR / E to Turn On the Light!";
          actionPromptEl.style.display = "block";
        } else if (nearActiveCage) {
          actionPromptEl.textContent = `Press SPACEBAR to Throw ${activeInfo.monsterLabel} into ${activeInfo.cageLabel}!`;
          actionPromptEl.style.display = "block";
        } else if (clownInCage && inCabin && !borrowedMoney) {
          objectiveEl.textContent = "🏚️ It's abandoned! Go back to the Clown's cage and take $10 for free!";
          actionPromptEl.style.display = "none";
        } else if (clownInCage && !borrowedMoney && distPod < 5.0) {
          actionPromptEl.textContent = "Press SPACEBAR / E to Take $10 for free!";
          actionPromptEl.style.display = "block";
        } else if (clownInCage && inCabin && borrowedMoney && !paidForMoreRoom) {
          actionPromptEl.textContent = "Press SPACEBAR / E to Pay $10 & Fix House!";
          actionPromptEl.style.display = "block";
        } else if (laserCaptured && !laserInCage && distPod2 < 4.5) {
          actionPromptEl.textContent = "🤖 Press SPACEBAR / E to Put Laser Guy next to the Clown!";
          actionPromptEl.style.display = "block";
        } else if (laserInCage && !laserMoneyTaken && distPod2 < 4.5) {
          actionPromptEl.textContent = axeLevel >= 1 ? "💰 Press SPACEBAR / E to Get $10 from Laser Guy!" : "🪓 Craft a Lv.1 Axe first to get $10!";
          actionPromptEl.style.display = "block";
        } else if (slimeCaptured && !slimeInCage && distPod3 < 4.5) {
          actionPromptEl.textContent = "🟢 Press SPACEBAR / E to Put Slime Guy next to Laser Guy!";
          actionPromptEl.style.display = "block";
        } else if (slimeInCage && !slimeMoneyTaken && distPod3 < 4.5) {
          actionPromptEl.textContent = axeLevel >= 2 ? "💰 Press SPACEBAR / E to Get $10 from Slime Guy!" : "🪓 Craft a Lv.2 Axe (2 Wood + 1 Stone) for $10!";
          actionPromptEl.style.display = "block";
        } else if (clownInCage && distCraft < 2.8) {
          if (axeLevel === 0) actionPromptEl.textContent = "🔨 Press SPACEBAR / E to Craft Lv.1 Axe & Pickaxe!";
          else if (axeLevel === 1 && wood >= 2 && stone >= 1) actionPromptEl.textContent = "🪓✨ Press SPACEBAR / E to Craft LEVEL 2 AXE!";
          else if (wood >= 1) actionPromptEl.textContent = "🧱 Press SPACEBAR / E to Build a Wooden Block (1 Wood)!";
          else actionPromptEl.textContent = "🪵 Chop 2 Trees & 1 Rock for Level 2 Axe!";
          actionPromptEl.style.display = "block";
        } else if (paidForMoreRoom && distPortal < 2.6) {
          actionPromptEl.textContent = "🌀 Press SPACEBAR / E to Teleport back to the Real Lab!";
          actionPromptEl.style.display = "block";
        } else if (nearChoppable) {
          actionPromptEl.textContent = `🪓 Press SPACEBAR / E to Chop ${nearChoppable.category === "tree" ? "Tree (+1 Wood)" : "Rock (+1 Stone)"}!`;
          actionPromptEl.style.display = "block";
        } else {
          actionPromptEl.style.display = "none";
        }

        // Smooth high-angle follow camera (looks cleanly over walls!)
        const targetCamPos = new THREE.Vector3(
          player.position.x,
          player.position.y + 8.5,
          player.position.z + 5.5
        );
        camera.position.lerp(targetCamPos, 0.12);
        camera.lookAt(player.position.x, player.position.y + 1.0, player.position.z);

        // Update weapon attack ring flash & stun timer + animate EVERY visible monster's limbs!
        if (attackFlashTimer > 0) {
          attackFlashTimer -= dt;
          attackRing.scale.setScalar(1.0 + (0.35 - attackFlashTimer) * 4.0);
          if (attackFlashTimer <= 0) {
            attackRing.visible = false;
            attackRing.scale.setScalar(1.0);
          }
        }
        if (monsterStunTimer > 0) monsterStunTimer -= dt;
        const animT = clock.elapsedTime;
        updateLifelikeMonster(clown, dt, animT, player);
        updateLifelikeMonster(laserGuy, dt, animT, player);
        updateLifelikeMonster(slimeGuy, dt, animT, player);
        updateLifelikeMonster(shadowGuy, dt, animT, player);
        updateLifelikeMonster(ghostGuy, dt, animT, player);
        for (const d of labMonsterDefs) updateLifelikeMonster(d.obj, dt, animT, player);
        for (const b of houseBossDefs) updateLifelikeMonster(b.obj, dt, animT, player);

        // Play spooky ambient noises every few seconds!
        ambientSoundTimer += dt;
        if (ambientSoundTimer > 4.5) {
          ambientSoundTimer = 0;
          if (audioCtx.state === "running") playSpookyForestNoise();
        }

        // Update Blender glTF AnimationMixer & floating forest fireflies!
        if (mixer) mixer.update(dt);
        if (fireflies) {
          fireflies.position.y = Math.sin(clock.elapsedTime * 0.9) * 0.45;
          fireflies.rotation.y = Math.sin(clock.elapsedTime * 0.15) * 0.04;
        }

        drawMinimap();
        composer.render();
      }

      animate();
    </script>
  </body>
</html>
