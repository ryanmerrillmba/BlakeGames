<!doctype html>
<html lang="en" data-game="the-game">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Game — Blake Games</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        overflow: hidden;
        background: #1e293b;
        color: #f8fafc;
        font-family: "Fredoka", "Space Grotesk", system-ui, -apple-system, sans-serif;
        user-select: none;
      }
      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        right: 16px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        pointer-events: none;
        z-index: 10;
      }
      .panel {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        border: 2px solid rgba(148, 163, 184, 0.35);
        border-radius: 16px;
        padding: 12px 18px;
        pointer-events: auto;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
        max-width: 480px;
      }
      .back-btn {
        display: inline-block;
        color: #93c5fd;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.95rem;
        margin-bottom: 6px;
      }
      .back-btn:hover {
        text-decoration: underline;
      }
      h1 {
        font-size: 1.4rem;
        color: #facc15;
        margin-bottom: 4px;
      }
      #objective {
        font-size: 1rem;
        color: #e2e8f0;
        line-height: 1.35;
      }
      #controls-hint {
        font-size: 0.9rem;
        color: #cbd5e1;
        text-align: right;
      }
      #action-prompt {
        position: fixed;
        bottom: 36px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(250, 204, 21, 0.96);
        color: #0f172a;
        border: none;
        font-weight: 800;
        font-size: 1.15rem;
        padding: 12px 26px;
        border-radius: 999px;
        box-shadow: 0 8px 25px rgba(250, 204, 21, 0.4);
        display: none;
        cursor: pointer;
        z-index: 15;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud">
      <div class="panel">
        <a class="back-btn" href="../index.html">← Back to Blake Games</a>
        <h1>The Game <span id="money-hud" style="color:#4ade80; font-size:1.1rem; margin-left:10px;">💰 $0</span></h1>
        <div id="objective">Objective: Walk through the door into the weird lab!</div>
      </div>
      <div class="panel" id="controls-hint">
        <strong>Move:</strong> Click/Drag Mouse, or W A S D / Arrows<br />
        <strong>Action:</strong> SPACEBAR / E &nbsp;|&nbsp; <strong>Doors:</strong> F
      </div>
    </div>

    <button id="action-prompt" type="button">Action</button>

    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x334155);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 250);
      camera.position.set(0, 5, 7);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      // Bright lighting so the whole screen is clearly visible + Flashlight!
      const ambient = new THREE.AmbientLight(0xffffff, 2.2);
      scene.add(ambient);

      const sunLight = new THREE.DirectionalLight(0xf8fafc, 1.3);
      sunLight.position.set(15, 35, 20);
      scene.add(sunLight);

      const darkRoomLight = new THREE.PointLight(0x93c5fd, 12, 22);
      darkRoomLight.position.set(0, 3.5, 0);
      scene.add(darkRoomLight);

      const labLight = new THREE.PointLight(0x4ade80, 22, 35);
      labLight.position.set(0, 4.2, -15);
      scene.add(labLight);

      // Player Flashlight
      const flashlight = new THREE.SpotLight(0xfffbeb, 65, 35, Math.PI / 4, 0.35, 0.8);
      const flashlightTarget = new THREE.Object3D();
      scene.add(flashlight);
      scene.add(flashlightTarget);
      flashlight.target = flashlightTarget;

      // Game State
      let player = null;
      let legL = null, legR = null, armL = null, armR = null;
      let flashlightMesh = null;
      let clown = null;
      let clownLegL = null, clownLegR = null;
      let laserGuy = null;
      let laserLegL = null, laserLegR = null;
      let laserBeam = null;
      let laserTimer = 0;
      let laserActive = 0;
      let laserCaptured = false;
      let throwingLaser = false;
      let laserInCage = false;
      let laserMoneyTaken = false;
      let slimeGuy = null;
      let slimeCaptured = false;
      let throwingSlime = false;
      let slimeInCage = false;
      let slimeMoneyTaken = false;
      let shadowGuy = null;
      let shadowCaptured = false;
      let throwingShadow = false;
      let shadowInCage = false;
      let ghostGuy = null;
      let ghostCaptured = false;
      let throwingGhost = false;
      let ghostInCage = false;
      let ghostTeleportTimer = 0;

      // 9 Lab Monsters queue (Pods 4..12) unlocked one by one after Slime Guy!
      const labMonsterDefs = [
        { key: "Monster_Vampire", label: "🧛 Vampire", podIdx: 3, flies: false },
        { key: "Monster_Witch", label: "🧙 Witch", podIdx: 4, flies: true },
        { key: "Monster_Pumpkin", label: "🎃 Pumpkin", podIdx: 5, flies: false },
        { key: "Monster_Cat", label: "🐈‍⬛ Cat", podIdx: 6, flies: false },
        { key: "Monster_Bat", label: "🦇 Bat", podIdx: 7, flies: true },
        { key: "Monster_Spider", label: "🕷️ Spider", podIdx: 8, flies: false },
        { key: "Monster_Skeleton", label: "💀 Skeleton", podIdx: 9, flies: false },
        { key: "Monster_Eyeball", label: "👁️ Magical Eyeball", podIdx: 10, flies: true },
        { key: "Monster_Robot", label: "🤖 Robot", podIdx: 11, flies: false },
        { key: "Monster_Frankenstein", label: "🧟‍♂️ Frankenstein", podIdx: 12, flies: false },
        { key: "Monster_Zombie", label: "🧟 Zombie", podIdx: 13, flies: false },
        { key: "Monster_Werewolf", label: "🐺 Gray Werewolf", podIdx: 12, flies: false },
        { key: "Monster_Mummy", label: "🧻 Mummy", podIdx: 13, flies: false },
      ];

      // 3 Super-Rare Hard-to-Find House Bosses (unlocks ONLY far in the game after Shadow Guy & Ghost!)
      const houseBossDefs = [
        { key: "Monster_RainbowSnake", label: "🌈🐍 Rainbow Snake (RARE BOSS)", cageIdx: 0, flies: false, speed: 3.4 },
        { key: "Monster_FlyingPumpkin", label: "🎃🪽 Crazy Flying Pumpkin (RARE BOSS)", cageIdx: 1, flies: true, speed: 4.2 },
        { key: "Monster_BoneBreaker", label: "🦴💥 Armored Bone Breaker (FINAL BOSS)", cageIdx: 2, flies: false, speed: 3.8 },
      ];
      let bossIdx = 0;
      let activeBossCaptured = false;
      let activeBossThrowing = false;
      let allBossesCaged = false;
      let labQueueIdx = 0; // active monster in labMonsterDefs after slimeInCage
      let activeLabCaptured = false;
      let activeLabThrowing = false;
      let allLabMonstersCaged = false;
      let podCap0 = null;
      let craftTableObj = null;
      let portalObjRef = null;
      let firstPodPos = new THREE.Vector3(-9.0, 0, -9.0);
      let secondPodPos = new THREE.Vector3(-4.5, 0, -10.5); // Laser Guy goes next to Clown in Lab!
      let thirdPodPos = new THREE.Vector3(0.0, 0, -10.0);   // Slime Guy goes next to Laser Guy in Lab!
      let rareCagePos = new THREE.Vector3(-12.6, 0, 30.8);  // Rare Shadow Guy goes in House Cage 1!
      let rareCage2Pos = new THREE.Vector3(-10.0, 0, 30.8); // Rare Ghost goes in House Cage 2!
      const colliders = []; // { name, category, box, mesh, active }
      const doorPivots = []; // { obj, openAngle, closedAngle, isOpen }
      const PLAYER_RADIUS = 0.30;

      let walkTime = 0;
      let stepTimer = 0;
      let level = 1;
      let visitedLab = false;
      let lightTurnedOn = false;
      let outsideEntered = false;
      let clownCaptured = false;
      let throwingClown = false;
      let throwProgress = 0;
      let throwStartPos = new THREE.Vector3();
      let clownInCage = false;
      let money = 0;
      let wood = 0;
      let stone = 0;
      let axeLevel = 0; // 0 = none, 1 = Lv.1 Axe + Pickaxe, 2 = Lv.2 Axe!
      let borrowedMoney = false;
      let paidForMoreRoom = false;

      function updateHudStats() {
        let tools = "";
        if (axeLevel === 1) tools = " 🪓Lv1 ⛏️";
        if (axeLevel >= 2) tools = " 🪓Lv2 ⛏️";
        moneyHudEl.textContent = `💰 $${money}  🪵${wood} 🪨${stone}${tools}`;
      }

      const objectiveEl = document.getElementById("objective");
      const actionPromptEl = document.getElementById("action-prompt");
      const moneyHudEl = document.getElementById("money-hud");

      // Web Audio API Sound Effects
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      function playTone(freq, duration, type = "sine", vol = 0.14) {
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      }
      function playFootstep() {
        playTone(95 + Math.random() * 25, 0.06, "triangle", 0.07);
      }
      function playChime() {
        playTone(523.25, 0.14, "triangle", 0.16);
        setTimeout(() => playTone(659.25, 0.14, "triangle", 0.16), 120);
        setTimeout(() => playTone(783.99, 0.25, "triangle", 0.18), 240);
      }

      // Load Blender scene.glb (cache-busted so newest Blender export always loads!)
      const loader = new GLTFLoader();
      loader.load(
        "./scene.glb?v=" + Date.now(),
        (gltf) => {
          scene.add(gltf.scene);
          player = gltf.scene.getObjectByName("Player_Human");
          legL = gltf.scene.getObjectByName("Human_Leg_L");
          legR = gltf.scene.getObjectByName("Human_Leg_R");
          armL = gltf.scene.getObjectByName("Human_Arm_L");
          armR = gltf.scene.getObjectByName("Human_Arm_R");
          flashlightMesh = gltf.scene.getObjectByName("Flashlight_Body");
          clown = gltf.scene.getObjectByName("Monster_Clown");
          clownLegL = gltf.scene.getObjectByName("Clown_Leg_L");
          clownLegR = gltf.scene.getObjectByName("Clown_Leg_R");
          laserGuy = gltf.scene.getObjectByName("Monster_LaserGuy");
          laserLegL = gltf.scene.getObjectByName("Laser_Leg_L");
          laserLegR = gltf.scene.getObjectByName("Laser_Leg_R");
          slimeGuy = gltf.scene.getObjectByName("Monster_SlimeGuy");
          shadowGuy = gltf.scene.getObjectByName("Monster_ShadowGuy");
          ghostGuy = gltf.scene.getObjectByName("Monster_Ghost");
          // Only Clown is out first! Others come out strictly when it's their turn!
          if (laserGuy) laserGuy.visible = false;
          if (slimeGuy) slimeGuy.visible = false;
          if (shadowGuy) shadowGuy.visible = false;
          if (ghostGuy) ghostGuy.visible = false;
          for (const def of labMonsterDefs) {
            def.obj = gltf.scene.getObjectByName(def.key);
            if (def.obj) def.obj.visible = false;
            const p = gltf.scene.getObjectByName(`Pod_Base_${def.podIdx}`);
            def.podPos = p ? p.position.clone() : new THREE.Vector3(0, 0, -15);
          }
          for (const bdef of houseBossDefs) {
            bdef.obj = gltf.scene.getObjectByName(bdef.key);
            if (bdef.obj) bdef.obj.visible = false;
            const c = gltf.scene.getObjectByName(`House_Cage_Base_${bdef.cageIdx}`);
            bdef.cagePos = c ? c.position.clone() : new THREE.Vector3(-10, 0, 30.8);
          }

          podCap0 = gltf.scene.getObjectByName("Pod_Cap_0");
          craftTableObj = gltf.scene.getObjectByName("Cabin_Crafting_Table");
          portalObjRef = gltf.scene.getObjectByName("Cabin_Teleporter_Portal");
          const pod0 = gltf.scene.getObjectByName("Pod_Base_0");
          if (pod0) firstPodPos.copy(pod0.position);
          const pod1 = gltf.scene.getObjectByName("Pod_Base_1");
          if (pod1) secondPodPos.copy(pod1.position);
          const pod2 = gltf.scene.getObjectByName("Pod_Base_2");
          if (pod2) thirdPodPos.copy(pod2.position);
          const rare0 = gltf.scene.getObjectByName("House_Cage_Base_0");
          if (rare0) rareCagePos.copy(rare0.position);
          const rare1 = gltf.scene.getObjectByName("House_Cage_Base_1");
          if (rare1) rareCage2Pos.copy(rare1.position);

          // Glowing red laser beam for Red Laser Guy
          const beamGeo = new THREE.CylinderGeometry(0.08, 0.08, 16, 8);
          beamGeo.rotateX(Math.PI / 2);
          beamGeo.translate(0, 0, 8);
          laserBeam = new THREE.Mesh(beamGeo, new THREE.MeshBasicMaterial({ color: 0xff1122 }));
          laserBeam.visible = false;
          scene.add(laserBeam);

          // Add a visible glowing beam cone right onto the tip of the flashlight in his hand!
          if (flashlightMesh) {
            const coneGeo = new THREE.ConeGeometry(1.1, 5.0, 20, 1, true);
            coneGeo.translate(0, -2.5, 0);
            coneGeo.rotateX(Math.PI / 2);
            const coneMat = new THREE.MeshBasicMaterial({
              color: 0xfffbeb,
              transparent: true,
              opacity: 0.18,
              side: THREE.DoubleSide,
              depthWrite: false,
            });
            const beamCone = new THREE.Mesh(coneGeo, coneMat);
            beamCone.position.set(0, 0, -0.2);
            flashlightMesh.add(beamCone);
          }

          // Put lids on all cages except First Cage (Pod_Cap_0), collect door pivots, and build solid colliders
          gltf.scene.updateMatrixWorld(true);
          gltf.scene.traverse((obj) => {
            if (obj.name.startsWith("Door_Pivot_") || obj.name === "Cabin_Door_Pivot") {
              doorPivots.push({
                obj,
                openAngle: obj.rotation.y,
                closedAngle: 0,
                isOpen: true,
              });
            }
            if (obj.name.startsWith("Pod_Cap_") && obj.name !== "Pod_Cap_0") {
              obj.position.y = 3.0;
              obj.rotation.set(0, 0, 0);
            }
            if (!obj.isMesh) return;
            const n = obj.name;
            let category = null;
            if (n.includes("Wall") && !n.includes("Top")) category = "wall";
            else if (n.includes("Trunk")) category = "tree";
            else if (n.startsWith("Pod_Base_") || n.startsWith("House_Cage_Base_") || n.startsWith("Forest_Rock_") || n.startsWith("Lab_Table_") || n.startsWith("Abandoned_Crate_") || n.startsWith("Borrow_Money_Desk")) {
              category = "object";
            }
            if (category) {
              const box = new THREE.Box3().setFromObject(obj);
              colliders.push({ name: n, category, box, mesh: obj, active: true });
            }
          });
          if (podCap0) {
            podCap0.position.set(firstPodPos.x + 1.2, 0.35, firstPodPos.z + 1.4);
          }

          // Expose test hooks for automated collision & gameplay verification
          window.__THE_GAME__ = {
            ready: true,
            getPlayerPos: () => ({ x: player.position.x, y: player.position.y, z: player.position.z, rotY: player.rotation.y }),
            setPlayerPos: (x, z) => { player.position.x = x; player.position.z = z; },
            setLevel: (lvl) => { level = lvl; },
            getColliders: () => colliders.map((c) => ({
              name: c.name,
              category: c.category,
              min: { x: c.box.min.x, z: c.box.min.z },
              max: { x: c.box.max.x, z: c.box.max.z },
            })),
            canStandAt: (x, z) => !collidesAt(x, z),
            moveStep: (dx, dz, dt = 0.05) => movePlayer(dx, dz, dt),
          };

          if (player) {
            camera.position.set(player.position.x, player.position.y + 8.5, player.position.z + 5.5);
            camera.lookAt(player.position.x, player.position.y + 1.0, player.position.z);
          }

          // Built-in automated collision & house test suite when ?autotest=1 or ?test=house
          const params = new URLSearchParams(window.location.search);
          if (params.get("autotest") === "1" || params.get("test") === "house") {
            const results = [];
            const origX = player.position.x, origZ = player.position.z, origRot = player.rotation.y;

            // Test 1: Forward facing
            movePlayer(0, -1, 0.05);
            results.push({ name: "Faces Forward", pass: Math.abs(player.rotation.y) < 0.01 });

            // Test 2: Solid Wall collision
            player.position.set(-3.8, 0, 0);
            for (let i = 0; i < 40; i++) movePlayer(-1, 0, 0.05);
            results.push({ name: "Blocks Solid Walls", pass: player.position.x > -4.9 });

            // Test 3: Tree collision
            level = 2;
            const tree = colliders.find((c) => c.category === "tree");
            let treePass = false;
            if (tree) {
              const cx = (tree.box.min.x + tree.box.max.x) / 2;
              const cz = (tree.box.min.z + tree.box.max.z) / 2;
              player.position.set(tree.box.min.x - 1.2, 0, cz);
              for (let i = 0; i < 40; i++) movePlayer(1, 0, 0.05);
              treePass = player.position.x < cx;
            }
            results.push({ name: "Blocks Trees", pass: treePass });

            // Test 4: Solid Object collision (Pod_Base_0)
            const pod = colliders.find((c) => c.name === "Pod_Base_0");
            let podPass = false;
            if (pod) {
              const cx = (pod.box.min.x + pod.box.max.x) / 2;
              const cz = (pod.box.min.z + pod.box.max.z) / 2;
              player.position.set(cx, 0, pod.box.max.z + 1.2);
              for (let i = 0; i < 40; i++) movePlayer(0, -1, 0.05);
              podPass = player.position.z > cz;
            }
            results.push({ name: "Blocks Solid Objects", pass: podPass });

            // Test 5: Can Exit Dark Room into Lab, Exit into Forest, & Enter/Exit House
            const craftObj = gltf.scene.getObjectByName("Cabin_Crafting_Table");
            const portalObj = gltf.scene.getObjectByName("Cabin_Teleporter_Portal");
            const cabinDoorObj = gltf.scene.getObjectByName("Cabin_Door");
            const laserObj = gltf.scene.getObjectByName("Monster_LaserGuy");
            // Walk out of Dark Room into Lab through left doorway (x = -2.2)
            player.position.set(-2.2, 0, 1.5);
            for (let i = 0; i < 30; i++) movePlayer(0, -1, 0.05);
            const exitedToLab = player.position.z < -5.0;
            // Walk out of Dark Room into Forest through left outside doorway (x = -2.2)
            player.position.set(-2.2, 0, 1.5);
            for (let i = 0; i < 30; i++) movePlayer(0, 1, 0.05);
            const exitedToForest = player.position.z > 6.0;
            // Enter & Exit Bigger 9x9 House (doorway at z = 23.6)
            player.position.set(-10.0, 0, 22.0);
            for (let i = 0; i < 25; i++) movePlayer(0, 1, 0.05);
            const enteredHouse = player.position.z > 24.8;
            for (let i = 0; i < 25; i++) movePlayer(0, -1, 0.05);
            const exitedHouse = player.position.z < 22.5;
            results.push({ name: "Never Stuck (Can Exit Room & House)", pass: Boolean(exitedToLab && exitedToForest && enteredHouse && exitedHouse) });
            results.push({ name: "House Door + Crafting Table + Portal + 3 Cages", pass: Boolean(craftObj && portalObj && cabinDoorObj && gltf.scene.getObjectByName("House_Cage_Base_0")) });
            results.push({ name: "Red Laser Guy Far Away in Forest", pass: Boolean(laserObj && laserObj.position.z > 40) });

            // Restore player (or stay in House if ?test=house)
            if (new URLSearchParams(window.location.search).get("test") === "house") {
              level = 2;
              clownInCage = true;
              borrowedMoney = true;
              paidForMoreRoom = true;
              player.position.set(-10.0, 0, 26.8);
              player.rotation.y = Math.PI;
              camera.position.set(-10.0, 10.5, 36.0);
              camera.lookAt(-10.0, 1.0, 28.0);
              objectiveEl.textContent = "🏠 Bigger House! Crafting Table, Glowing Portal, 3 Extra Cages & Press F to move doors!";
            } else {
              level = 1;
              player.position.set(origX, 0, origZ);
              player.rotation.y = origRot;
            }

            const allPass = results.every((r) => r.pass);
            const badge = document.createElement("div");
            badge.id = "autotest-results";
            badge.style.cssText =
              "position:fixed;bottom:16px;right:16px;background:rgba(15,23,42,0.92);color:#f8fafc;border:2px solid " +
              (allPass ? "#22c55e" : "#ef4444") +
              ";border-radius:12px;padding:12px 16px;font-size:0.9rem;z-index:30;line-height:1.5;";
            badge.innerHTML =
              "<strong>" + (allPass ? "✅ ALL COLLISION TESTS PASSED" : "❌ SOME TESTS FAILED") + "</strong><br>" +
              results.map((r) => (r.pass ? "✅ " : "❌ ") + r.name).join("<br>") +
              `<br><small>Colliders: ${colliders.length} (${colliders.filter(c=>c.category==="wall").length} walls, ${colliders.filter(c=>c.category==="tree").length} trees, ${colliders.filter(c=>c.category==="object").length} objects)</small>`;
            document.body.appendChild(badge);
          }
        },
        undefined,
        (err) => {
          console.error("Failed to load scene.glb:", err);
          objectiveEl.textContent = "Error loading 3D scene.";
        }
      );

      // Input: Keyboard + Mouse Click/Drag to Walk
      const keys = {};
      let mouseTarget = null;
      let isMouseDown = false;
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

      function updateMouseTarget(clientX, clientY) {
        pointer.x = (clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hit = new THREE.Vector3();
        if (raycaster.ray.intersectPlane(floorPlane, hit)) {
          mouseTarget = hit;
        }
      }

      renderer.domElement.addEventListener("pointerdown", (e) => {
        isMouseDown = true;
        updateMouseTarget(e.clientX, e.clientY);
      });
      window.addEventListener("pointermove", (e) => {
        if (isMouseDown) updateMouseTarget(e.clientX, e.clientY);
      });
      window.addEventListener("pointerup", () => {
        isMouseDown = false;
      });

      function handleAction() {
        if (!player) return;

        // 1. Level 1: Turn on the light in the Dark Room
        const switchPos = new THREE.Vector3(-4.8, 0, 1.5);
        if (level === 1 && visitedLab && !lightTurnedOn && player.position.distanceTo(switchPos) < 3.5) {
          lightTurnedOn = true;
          level = 2;
          playChime();
          darkRoomLight.color.setHex(0xfef08a);
          darkRoomLight.intensity = 28;
          actionPromptEl.style.display = "none";
          objectiveEl.textContent = "💡 Light is ON! Go through the OTHER two doors in the Dark Room into the Forest!";
          return;
        }

        // 2. Level 2: Throw Clown into First Cage
        const distPod = Math.hypot(player.position.x - firstPodPos.x, player.position.z - firstPodPos.z);
        if (clownCaptured && !clownInCage && !throwingClown && distPod < 5.0 && clown) {
          throwingClown = true;
          throwProgress = 0;
          throwStartPos.copy(clown.position);
          actionPromptEl.style.display = "none";
          playTone(350, 0.2, "sine", 0.2);
          return;
        }

        // 3. At Clown's First Cage: Take $10 for free!
        if (clownInCage && !borrowedMoney && distPod < 5.0) {
          borrowedMoney = true;
          money += 10;
          moneyHudEl.textContent = `💰 $${money}`;
          playChime();
          actionPromptEl.style.display = "none";
          objectiveEl.textContent = "💰 Got $10 for free from the Clown! Go back to the Abandoned House and Pay $10!";
          return;
        }

        // 4. Inside Bigger 9x9 Abandoned House: Pay $10, Craft Tool, Put Laser Guy in Cage, or Teleport!
        const inCabin =
          player.position.x > -14.5 &&
          player.position.x < -5.5 &&
          player.position.z > 23.5 &&
          player.position.z < 32.5;

        if (clownInCage && inCabin && borrowedMoney && !paidForMoreRoom && money >= 10) {
          paidForMoreRoom = true;
          money -= 10;
          updateHudStats();
          playChime();
          objectiveEl.textContent = "🔨 House Fixed! Use the Crafting Table to craft your Axe & Pickaxe!";
          return;
        }

        // Throw captured Laser Guy into Pod 2 (right next to the Clown in the Lab!)
        const distPod2 = Math.hypot(player.position.x - secondPodPos.x, player.position.z - secondPodPos.z);
        if (laserCaptured && !laserInCage && !throwingLaser && laserGuy && distPod2 < 4.5) {
          throwingLaser = true;
          throwProgress = 0;
          throwStartPos.copy(laserGuy.position);
          actionPromptEl.style.display = "none";
          playTone(350, 0.2, "sine", 0.2);
          return;
        }

        // Collect $10 from Laser Guy (needs Lv.1 Axe!)
        if (laserInCage && !laserMoneyTaken && distPod2 < 4.5) {
          if (axeLevel >= 1) {
            laserMoneyTaken = true;
            money += 10;
            updateHudStats();
            playChime();
            objectiveEl.textContent = "💰 Got $10 from the Laser Guy! Now find the green Slime Guy in the forest!";
          } else {
            objectiveEl.textContent = "🪓 Craft a Lv.1 Axe at the Crafting Table first to get $10 from the Laser Guy!";
          }
          return;
        }

        // Throw captured Slime Guy into Pod 3 (right next to the Laser Guy in the Lab!)
        const distPod3 = Math.hypot(player.position.x - thirdPodPos.x, player.position.z - thirdPodPos.z);
        if (slimeCaptured && !slimeInCage && !throwingSlime && slimeGuy && distPod3 < 4.5) {
          throwingSlime = true;
          throwProgress = 0;
          throwStartPos.copy(slimeGuy.position);
          actionPromptEl.style.display = "none";
          playTone(350, 0.2, "sine", 0.2);
          return;
        }

        // Collect $10 from Slime Guy (needs Lv.2 Axe!)
        if (slimeInCage && !slimeMoneyTaken && distPod3 < 4.5) {
          if (axeLevel >= 2) {
            slimeMoneyTaken = true;
            money += 10;
            updateHudStats();
            playChime();
            objectiveEl.textContent = "💰 Got $10 from the Slime Guy! Watch out—the RARE SHADOW GUY is now out in the forest!";
          } else {
            objectiveEl.textContent = "🪓 Craft a Lv.2 Axe (2 Wood + 1 Stone) at the Crafting Table to get $10 from the Slime Guy!";
          }
          return;
        }

        // Throw active Lab Queue Monster (Vampire..Robot) into its Lab Pod!
        if (slimeInCage && !allLabMonstersCaged && activeLabCaptured && !activeLabThrowing) {
          const def = labMonsterDefs[labQueueIdx];
          if (def && def.obj && Math.hypot(player.position.x - def.podPos.x, player.position.z - def.podPos.z) < 4.8) {
            activeLabThrowing = true;
            throwProgress = 0;
            throwStartPos.copy(def.obj.position);
            actionPromptEl.style.display = "none";
            playTone(360, 0.2, "sine", 0.2);
            return;
          }
        }

        // Throw captured RARE Shadow Guy into House Cage 1!
        const distRare = Math.hypot(player.position.x - rareCagePos.x, player.position.z - rareCagePos.z);
        if (shadowCaptured && !shadowInCage && !throwingShadow && shadowGuy && distRare < 4.5) {
          throwingShadow = true;
          throwProgress = 0;
          throwStartPos.copy(shadowGuy.position);
          actionPromptEl.style.display = "none";
          playTone(350, 0.2, "sine", 0.2);
          return;
        }

        // Throw captured SUPER-RARE House Boss (Rainbow Snake / Flying Pumpkin / Bone Breaker) into its House Cage!
        if (ghostInCage && !allBossesCaged && activeBossCaptured && !activeBossThrowing) {
          const bdef = houseBossDefs[bossIdx];
          if (bdef && bdef.obj && Math.hypot(player.position.x - bdef.cagePos.x, player.position.z - bdef.cagePos.z) < 4.8) {
            activeBossThrowing = true;
            throwProgress = 0;
            throwStartPos.copy(bdef.obj.position);
            actionPromptEl.style.display = "none";
            playTone(460, 0.25, "sine", 0.22);
            return;
          }
        }

        // Throw captured TELEPORTING GHOST into House Cage 2!
        const distRare2 = Math.hypot(player.position.x - rareCage2Pos.x, player.position.z - rareCage2Pos.z);
        if (ghostCaptured && !ghostInCage && !throwingGhost && ghostGuy && distRare2 < 4.5) {
          throwingGhost = true;
          throwProgress = 0;
          throwStartPos.copy(ghostGuy.position);
          actionPromptEl.style.display = "none";
          playTone(420, 0.2, "sine", 0.2);
          return;
        }

        // Use Crafting Table inside House: Craft Lv.1 Axe & Pickaxe -> Craft Lv.2 Axe -> Build Wooden Block!
        if (clownInCage && craftTableObj) {
          const distCraft = Math.hypot(player.position.x - craftTableObj.position.x, player.position.z - craftTableObj.position.z);
          if (distCraft < 2.8) {
            if (axeLevel === 0) {
              axeLevel = 1;
              updateHudStats();
              playChime();
              objectiveEl.textContent = "🪓⛏️ Crafted Lv.1 Axe & Pickaxe! Chop trees & rocks for Wood & Stone!";
              return;
            } else if (axeLevel === 1 && wood >= 2 && stone >= 1) {
              wood -= 2;
              stone -= 1;
              axeLevel = 2;
              updateHudStats();
              playChime();
              objectiveEl.textContent = "🪓✨ Crafted LEVEL 2 AXE! Now you can get $10 from the Slime Guy!";
              return;
            } else if (axeLevel >= 1 && wood >= 1) {
              wood -= 1;
              updateHudStats();
              // Build a solid wooden crate right in front of the player!
              const bx = player.position.x - Math.sin(player.rotation.y) * 1.5;
              const bz = player.position.z - Math.cos(player.rotation.y) * 1.5;
              const block = new THREE.Mesh(
                new THREE.BoxGeometry(1.1, 1.1, 1.1),
                new THREE.MeshStandardMaterial({ color: 0xa16207, roughness: 0.8 })
              );
              block.position.set(bx, 0.55, bz);
              scene.add(block);
              colliders.push({ name: "Built_Block", category: "object", box: new THREE.Box3().setFromObject(block), mesh: block, active: true });
              playChime();
              objectiveEl.textContent = "🧱 Built a Wooden Block using your Crafting Table!";
              return;
            } else {
              objectiveEl.textContent = "🪵 Chop 2 Trees & 1 Rock outside to craft your Level 2 Axe!";
              return;
            }
          }
        }

        // Teleport back to Real Lab when near the Glowing Portal!
        if (paidForMoreRoom && portalObjRef) {
          const distPortal = Math.hypot(player.position.x - portalObjRef.position.x, player.position.z - portalObjRef.position.z);
          if (distPortal < 2.6) {
            player.position.set(0, 0, -10.0);
            playChime();
            actionPromptEl.style.display = "none";
            objectiveEl.textContent = "🌀 Teleported back into the Real Lab!";
            return;
          }
        }

        // 5. Chop down Trees (Wood) & Rocks (Stone) in the forest once the House is unlocked!
        if (clownInCage) {
          const choppable = findChoppableNearPlayer();
          if (choppable) {
            choppable.active = false;
            choppable.mesh.visible = false;
            if (choppable.name.includes("Trunk")) {
              const leavesName = choppable.name.replace("Trunk", "Leaves");
              const leavesObj = scene.getObjectByName(leavesName);
              if (leavesObj) leavesObj.visible = false;
              wood += 1;
            } else {
              stone += 1;
            }
            money += 2;
            updateHudStats();
            playTone(140, 0.14, "sawtooth", 0.18);
            objectiveEl.textContent = choppable.category === "tree"
              ? "🪓 Chopped a Tree! (+1 🪵 Wood, +$2)"
              : "⛏️ Mined a Rock! (+1 🪨 Stone, +$2)";
            return;
          }
        }
      }

      window.addEventListener("keydown", (e) => {
        keys[e.code] = true;
        mouseTarget = null;
        if (e.code === "KeyF") {
          toggleNearestDoor();
        }
        if (e.code === "KeyE" || e.code === "Space") {
          if (e.code === "Space") e.preventDefault();
          handleAction();
        }
      });
      window.addEventListener("keyup", (e) => {
        keys[e.code] = false;
      });
      actionPromptEl.addEventListener("click", handleAction);

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function collidesAt(x, z) {
        for (let i = 0; i < colliders.length; i++) {
          if (!colliders[i].active) continue;
          const b = colliders[i].box;
          if (
            x + PLAYER_RADIUS > b.min.x &&
            x - PLAYER_RADIUS < b.max.x &&
            z + PLAYER_RADIUS > b.min.z &&
            z - PLAYER_RADIUS < b.max.z
          ) {
            return true;
          }
        }
        return false;
      }

      function toggleNearestDoor() {
        if (!player) return false;
        let best = null;
        let bestDist = 3.6;
        const pos = new THREE.Vector3();
        for (const d of doorPivots) {
          d.obj.getWorldPosition(pos);
          const dist = Math.hypot(player.position.x - pos.x, player.position.z - pos.z);
          if (dist < bestDist) {
            bestDist = dist;
            best = d;
          }
        }
        if (best) {
          best.isOpen = !best.isOpen;
          best.obj.rotation.y = best.isOpen ? best.openAngle : best.closedAngle;
          playTone(best.isOpen ? 320 : 180, 0.12, "square", 0.12);
          return true;
        }
        return false;
      }

      function findChoppableNearPlayer() {
        if (!player) return null;
        let best = null;
        let bestDist = 2.8;
        for (const c of colliders) {
          if (!c.active) continue;
          if (c.category !== "tree" && !c.name.startsWith("Forest_Rock_")) continue;
          const cx = (c.box.min.x + c.box.max.x) / 2;
          const cz = (c.box.min.z + c.box.max.z) / 2;
          const dist = Math.hypot(player.position.x - cx, player.position.z - cz);
          if (dist < bestDist) {
            bestDist = dist;
            best = c;
          }
        }
        return best;
      }

      function movePlayer(dx, dz, dt) {
        const speed = 6.5;
        const len = Math.hypot(dx, dz);
        if (len === 0) return;
        const nx = dx / len;
        const nz = dz / len;

        // Flip human forward! (In glTF from Blender, face & flashlight are on local -Z)
        player.rotation.y = Math.atan2(-nx, -nz);

        const maxZ = 195.0;
        const maxX = player.position.z > 4.0 ? 95.0 : 11.3;

        const nextX = THREE.MathUtils.clamp(player.position.x + nx * speed * dt, -maxX, maxX);
        if (!collidesAt(nextX, player.position.z)) {
          player.position.x = nextX;
        }
        const nextZ = THREE.MathUtils.clamp(player.position.z + nz * speed * dt, -25.3, maxZ);
        if (!collidesAt(player.position.x, nextZ)) {
          player.position.z = nextZ;
        }
      }

      const clock = new THREE.Clock();
      const flashWorldPos = new THREE.Vector3();

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);

        if (!player) {
          renderer.render(scene, camera);
          return;
        }

        // Movement
        let dx = 0;
        let dz = 0;
        if (keys["KeyW"] || keys["ArrowUp"]) dz -= 1;
        if (keys["KeyS"] || keys["ArrowDown"]) dz += 1;
        if (keys["KeyA"] || keys["ArrowLeft"]) dx -= 1;
        if (keys["KeyD"] || keys["ArrowRight"]) dx += 1;

        if (dx === 0 && dz === 0 && mouseTarget) {
          const mdx = mouseTarget.x - player.position.x;
          const mdz = mouseTarget.z - player.position.z;
          if (Math.hypot(mdx, mdz) > 0.25) {
            dx = mdx;
            dz = mdz;
          } else {
            mouseTarget = null;
          }
        }

        if (dx !== 0 || dz !== 0) {
          movePlayer(dx, dz, dt);
          walkTime += dt * 10;
          const swing = Math.sin(walkTime) * 0.55;
          if (legL) legL.rotation.x = swing;
          if (legR) legR.rotation.x = -swing;
          if (armL) armL.rotation.x = -swing * 0.8;
          if (armR) armR.rotation.x = 0.96 + swing * 0.2;
          stepTimer += dt;
          if (stepTimer > 0.28) {
            playFootstep();
            stepTimer = 0;
          }
        } else {
          if (legL) legL.rotation.x *= 0.8;
          if (legR) legR.rotation.x *= 0.8;
          if (armL) armL.rotation.x *= 0.8;
        }

        // Update Flashlight beam directly from the flashlight in his hand pointing forward (-Z local)
        const forwardX = -Math.sin(player.rotation.y);
        const forwardZ = -Math.cos(player.rotation.y);
        if (flashlightMesh) {
          flashlightMesh.getWorldPosition(flashWorldPos);
          flashlight.position.copy(flashWorldPos);
        } else {
          flashlight.position.set(player.position.x, player.position.y + 1.3, player.position.z);
        }
        flashlightTarget.position.set(
          flashlight.position.x + forwardX * 8,
          flashlight.position.y - 0.6,
          flashlight.position.z + forwardZ * 8
        );

        // Laser Guy ONLY active after Clown is caged! Once captured/caged, NO lasers!
        if (laserBeam && (laserCaptured || laserInCage || !clownInCage)) {
          laserBeam.visible = false;
        }
        if (laserGuy && laserBeam && clownInCage && !laserInCage && !throwingLaser) {
          laserGuy.visible = true;
          if (laserCaptured) {
            const tx = player.position.x - forwardX * 1.8;
            const tz = player.position.z - forwardZ * 1.8;
            const moveDist = Math.hypot(tx - laserGuy.position.x, tz - laserGuy.position.z);
            laserGuy.position.x += (tx - laserGuy.position.x) * 0.1;
            laserGuy.position.z += (tz - laserGuy.position.z) * 0.1;
            laserGuy.rotation.y = player.rotation.y;
            if (moveDist > 0.15) {
              const lSwing = Math.sin(clock.elapsedTime * 12) * 0.6;
              if (laserLegL) laserLegL.rotation.x = lSwing;
              if (laserLegR) laserLegR.rotation.x = -lSwing;
            } else {
              if (laserLegL) laserLegL.rotation.x *= 0.8;
              if (laserLegR) laserLegR.rotation.x *= 0.8;
            }
            laserBeam.visible = false;
          } else {
            const dxL = player.position.x - laserGuy.position.x;
            const dzL = player.position.z - laserGuy.position.z;
            const distL = Math.hypot(dxL, dzL);
            if (distL < 2.2) {
              laserCaptured = true;
              laserBeam.visible = false;
              playChime();
              objectiveEl.textContent = "🤖 You caught the Laser Guy! Bring him to Lab Pod 2 (next to the Clown) and throw him in!";
            } else if (distL < 18.0) {
              laserGuy.rotation.y = Math.atan2(dxL, dzL);
              laserTimer += dt;
              if (laserTimer > 2.0) {
                laserTimer = 0;
                laserActive = 0.35;
                laserBeam.position.set(laserGuy.position.x, 1.35, laserGuy.position.z);
                laserBeam.rotation.y = laserGuy.rotation.y;
                laserBeam.visible = true;
                playTone(180, 0.25, "sawtooth", 0.2);
                if (distL < 15.0) {
                  player.position.x += (dxL / distL) * 1.6;
                  player.position.z += (dzL / distL) * 1.6;
                  objectiveEl.textContent = "⚡ Zapped by Laser Guy! Dodge & catch him!";
                }
              }
            } else {
              laserGuy.rotation.y += dt * 0.8;
            }
            if (laserActive > 0) {
              laserActive -= dt;
              if (laserActive <= 0) laserBeam.visible = false;
            }
          }
        }

        // Slime Guy ONLY active after Laser Guy is caged!
        if (slimeGuy && laserInCage && !slimeInCage && !throwingSlime) {
          slimeGuy.visible = true;
          slimeGuy.scale.y = 1.0 + Math.sin(clock.elapsedTime * 5) * 0.12;
          if (slimeCaptured) {
            const tx = player.position.x - forwardX * 2.0;
            const tz = player.position.z - forwardZ * 2.0;
            slimeGuy.position.x += (tx - slimeGuy.position.x) * 0.1;
            slimeGuy.position.z += (tz - slimeGuy.position.z) * 0.1;
            slimeGuy.rotation.y = player.rotation.y;
          } else {
            const dxS = slimeGuy.position.x - player.position.x;
            const dzS = slimeGuy.position.z - player.position.z;
            const distS = Math.hypot(dxS, dzS);
            if (distS < 8.5 && distS >= 2.2) {
              player.position.x += (dxS / distS) * 2.2 * dt;
              player.position.z += (dzS / distS) * 2.2 * dt;
              objectiveEl.textContent = "🟢 WHOA! The Slime Guy is trying to suck you up! Catch him!";
            }
            if (distS < 2.2) {
              slimeCaptured = true;
              playChime();
              objectiveEl.textContent = "🟢 You caught the Slime Guy! Bring him to Lab Pod 3 (next to Laser Guy) and throw him in!";
            }
          }
        }

        // 9 Lab Queue Monsters (Vampire -> Witch -> Pumpkin -> Cat -> Bat -> Spider -> Skeleton -> Eyeball -> Robot)
        if (slimeInCage && !allLabMonstersCaged && labQueueIdx < labMonsterDefs.length) {
          const def = labMonsterDefs[labQueueIdx];
          if (def && def.obj) {
            def.obj.visible = true;
            if (def.flies && !activeLabThrowing) {
              def.obj.position.y = 1.9 + Math.sin(clock.elapsedTime * 5) * 0.35;
              if (def.key === "Monster_Bat") {
                const wl = def.obj.getObjectByName("Bat_WingPivot_L");
                const wr = def.obj.getObjectByName("Bat_WingPivot_R");
                const flap = Math.sin(clock.elapsedTime * 14) * 0.65;
                if (wl) wl.rotation.z = flap;
                if (wr) wr.rotation.z = -flap;
              }
            }
            if (activeLabThrowing) {
              throwProgress += dt * 1.6;
              const t = Math.min(throwProgress, 1.0);
              def.obj.position.x = THREE.MathUtils.lerp(throwStartPos.x, def.podPos.x, t);
              def.obj.position.z = THREE.MathUtils.lerp(throwStartPos.z, def.podPos.z, t);
              def.obj.position.y = Math.sin(t * Math.PI) * 2.5 + (def.flies ? 0.8 : 0.2) * t;
              if (t >= 1.0) {
                activeLabThrowing = false;
                activeLabCaptured = false;
                money += 10;
                updateHudStats();
                playChime();
                labQueueIdx += 1;
                if (labQueueIdx < labMonsterDefs.length) {
                  const nextDef = labMonsterDefs[labQueueIdx];
                  if (nextDef.obj) nextDef.obj.visible = true;
                  objectiveEl.textContent = `${def.label} caged (+$10)! Next up: go catch the ${nextDef.label} in the forest!`;
                } else {
                  allLabMonstersCaged = true;
                  if (shadowGuy) shadowGuy.visible = true;
                  objectiveEl.textContent = "🎉 ALL LAB MONSTERS CAGED! Now catch the RARE FLYING SHADOW GUY for your House!";
                }
              }
            } else if (activeLabCaptured) {
              const tx = player.position.x - forwardX * 2.0;
              const tz = player.position.z - forwardZ * 2.0;
              def.obj.position.x += (tx - def.obj.position.x) * 0.1;
              def.obj.position.z += (tz - def.obj.position.z) * 0.1;
              def.obj.rotation.y = player.rotation.y;
            } else {
              const dxM = player.position.x - def.obj.position.x;
              const dzM = player.position.z - def.obj.position.z;
              const distM = Math.hypot(dxM, dzM);
              if (distM < 10.0 && distM >= 2.2) {
                // Spider jumps down from the tree when you get close!
                if (def.key === "Monster_Spider" && def.obj.position.y > 0.05) {
                  def.obj.position.y = Math.max(0, def.obj.position.y - 6.0 * dt);
                  objectiveEl.textContent = "🕷️ WHOA! The Spider JUMPED DOWN from the tree to get you!";
                }
                def.obj.position.x += (dxM / distM) * 2.4 * dt;
                def.obj.position.z += (dzM / distM) * 2.4 * dt;
                def.obj.rotation.y = Math.atan2(dxM, dzM);
              }
              if (distM < 2.2) {
                activeLabCaptured = true;
                playChime();
                objectiveEl.textContent = `You caught the ${def.label}! Bring it to Lab Pod ${def.podIdx + 1} and press SPACEBAR to throw it in!`;
              }
            }
          }
        }

        // RARE FLYING Shadow Guy ONLY active after ALL Lab Monsters are caged! Flies in the air with swaying motion!
        if (shadowGuy && allLabMonstersCaged && !shadowInCage && !throwingShadow) {
          shadowGuy.visible = true;
          shadowGuy.position.y = 1.6 + Math.sin(clock.elapsedTime * 4) * 0.35;
          shadowGuy.rotation.z = Math.sin(clock.elapsedTime * 3.5) * 0.14;
          if (shadowCaptured) {
            const tx = player.position.x - forwardX * 2.0;
            const tz = player.position.z - forwardZ * 2.0;
            shadowGuy.position.x += (tx - shadowGuy.position.x) * 0.1;
            shadowGuy.position.z += (tz - shadowGuy.position.z) * 0.1;
            shadowGuy.rotation.y = player.rotation.y;
          } else {
            const dxSh = player.position.x - shadowGuy.position.x;
            const dzSh = player.position.z - shadowGuy.position.z;
            const distSh = Math.hypot(dxSh, dzSh);
            if (distSh < 12.0 && distSh >= 2.2) {
              shadowGuy.position.x += (dxSh / distSh) * 3.0 * dt;
              shadowGuy.position.z += (dzSh / distSh) * 3.0 * dt;
              shadowGuy.rotation.y = Math.atan2(dxSh, dzSh);
              objectiveEl.textContent = "👻 FLYING SHADOW GUY is swooping at you! Catch him for your House Cage!";
            }
            if (distSh < 2.2) {
              shadowCaptured = true;
              playChime();
              objectiveEl.textContent = "👻 You caught the FLYING SHADOW GUY! Bring him to House Cage 1 and throw him in!";
            }
          }
        }

        // TELEPORTING GHOST ONLY active after Shadow Guy is caged! Goes into House Cage 2!
        if (ghostGuy && shadowInCage && !ghostInCage && !throwingGhost) {
          ghostGuy.visible = true;
          ghostGuy.position.y = 1.4 + Math.sin(clock.elapsedTime * 3.5) * 0.3;
          if (ghostCaptured) {
            const tx = player.position.x - forwardX * 2.0;
            const tz = player.position.z - forwardZ * 2.0;
            ghostGuy.position.x += (tx - ghostGuy.position.x) * 0.1;
            ghostGuy.position.z += (tz - ghostGuy.position.z) * 0.1;
            ghostGuy.rotation.y = player.rotation.y;
          } else {
            const dxG = player.position.x - ghostGuy.position.x;
            const dzG = player.position.z - ghostGuy.position.z;
            const distG = Math.hypot(dxG, dzG);
            if (distG < 14.0 && distG >= 2.2) {
              ghostTeleportTimer += dt;
              if (ghostTeleportTimer > 2.8) {
                ghostTeleportTimer = 0;
                const ang = Math.random() * Math.PI * 2;
                ghostGuy.position.x = THREE.MathUtils.clamp(player.position.x + Math.cos(ang) * 7.5, -80, 80);
                ghostGuy.position.z = THREE.MathUtils.clamp(player.position.z + Math.sin(ang) * 7.5, 10, 180);
                playTone(620, 0.2, "sine", 0.14);
                objectiveEl.textContent = "👻💨 The Ghost TELEPORTED! Track him down with your flashlight!";
              }
            }
            if (distG < 2.2) {
              ghostCaptured = true;
              playChime();
              objectiveEl.textContent = "👻💨 You caught the TELEPORTING GHOST! Bring him to House Cage 2 and throw him in!";
            }
          }
        }

        // Level 1: Enter Lab
        if (level === 1 && !visitedLab && player.position.z < -4.5) {
          visitedLab = true;
          playTone(220, 0.3, "sawtooth", 0.12);
          objectiveEl.textContent = "Whoa! Go back to the Dark Room and turn on the yellow Light Switch!";
        }

        // Level 2: Enter Forest
        if (level === 2 && !outsideEntered && player.position.z > 4.5) {
          outsideEntered = true;
          playTone(220, 0.3, "sawtooth", 0.12);
          objectiveEl.textContent = "🤡 Capture a Clown! Use your flashlight to find him in the forest!";
        }

        // Level 2: Clown tries to scare you, then you catch him
        if (level === 2 && outsideEntered && !clownCaptured && !clownInCage && clown) {
          const dxC = player.position.x - clown.position.x;
          const dzC = player.position.z - clown.position.z;
          const distC = Math.hypot(dxC, dzC);
          if (distC < 8.0 && distC >= 2.2) {
            clown.position.x += (dxC / distC) * 2.0 * dt;
            clown.position.z += (dzC / distC) * 2.0 * dt;
            clown.rotation.y = Math.atan2(dxC, dzC);
            objectiveEl.textContent = "🤡 BOO! The Clown is trying to scare you! Catch him!";
          }
          if (distC < 2.2) {
            clownCaptured = true;
            playChime();
            objectiveEl.textContent = "First cage! Bring the Clown back to the First cage and throw him in!";
          }
        }

        // Clown follows player with moving feet (until thrown!)
        if (clownCaptured && !clownInCage && !throwingClown && clown) {
          const targetX = player.position.x - forwardX * 1.6;
          const targetZ = player.position.z - forwardZ * 1.6;
          const moveDist = Math.hypot(targetX - clown.position.x, targetZ - clown.position.z);
          clown.position.x += (targetX - clown.position.x) * 0.1;
          clown.position.z += (targetZ - clown.position.z) * 0.1;
          clown.rotation.y = player.rotation.y;
          if (moveDist > 0.15) {
            const cSwing = Math.sin(clock.elapsedTime * 12) * 0.6;
            if (clownLegL) clownLegL.rotation.x = cSwing;
            if (clownLegR) clownLegR.rotation.x = -cSwing;
          } else {
            if (clownLegL) clownLegL.rotation.x *= 0.8;
            if (clownLegR) clownLegR.rotation.x *= 0.8;
          }
        }

        // Throwing Clown animation
        if (throwingClown && clown) {
          throwProgress += dt * 1.6;
          const t = Math.min(throwProgress, 1.0);
          clown.position.x = THREE.MathUtils.lerp(throwStartPos.x, firstPodPos.x, t);
          clown.position.z = THREE.MathUtils.lerp(throwStartPos.z, firstPodPos.z, t);
          clown.position.y = Math.sin(t * Math.PI) * 2.5 + 0.3 * t;
          if (t >= 1.0) {
            throwingClown = false;
            clownInCage = true;
            if (podCap0) {
              podCap0.position.set(firstPodPos.x, 3.0, firstPodPos.z);
              podCap0.rotation.set(0, 0, 0);
            }
            playChime();
            objectiveEl.textContent = "🏠 The house is unlocked! Go find the abandoned house in the forest!";
          }
        }

        // Throwing animations for Laser Guy, Slime Guy, and RARE Shadow Guy!
        if (throwingLaser && laserGuy) {
          throwProgress += dt * 1.6;
          const t = Math.min(throwProgress, 1.0);
          laserGuy.position.x = THREE.MathUtils.lerp(throwStartPos.x, secondPodPos.x, t);
          laserGuy.position.z = THREE.MathUtils.lerp(throwStartPos.z, secondPodPos.z, t);
          laserGuy.position.y = Math.sin(t * Math.PI) * 2.5 + 0.2 * t;
          if (t >= 1.0) {
            throwingLaser = false;
            laserInCage = true;
            if (slimeGuy) slimeGuy.visible = true;
            playChime();
            objectiveEl.textContent = "🤖 Threw Laser Guy into Lab Pod 2! Now the SLIME GUY is out in the forest!";
          }
        }
        if (throwingSlime && slimeGuy) {
          throwProgress += dt * 1.6;
          const t = Math.min(throwProgress, 1.0);
          slimeGuy.position.x = THREE.MathUtils.lerp(throwStartPos.x, thirdPodPos.x, t);
          slimeGuy.position.z = THREE.MathUtils.lerp(throwStartPos.z, thirdPodPos.z, t);
          slimeGuy.position.y = Math.sin(t * Math.PI) * 2.5 + 0.2 * t;
          if (t >= 1.0) {
            throwingSlime = false;
            slimeInCage = true;
            if (labMonsterDefs[0] && labMonsterDefs[0].obj) labMonsterDefs[0].obj.visible = true;
            playChime();
            objectiveEl.textContent = "🟢 Threw Slime Guy into Lab Pod 3! Next up: go catch the 🧛 Vampire in the forest!";
          }
        }
        if (throwingShadow && shadowGuy) {
          throwProgress += dt * 1.6;
          const t = Math.min(throwProgress, 1.0);
          shadowGuy.position.x = THREE.MathUtils.lerp(throwStartPos.x, rareCagePos.x, t);
          shadowGuy.position.z = THREE.MathUtils.lerp(throwStartPos.z, rareCagePos.z, t);
          shadowGuy.position.y = Math.sin(t * Math.PI) * 2.5 + 0.2 * t;
          if (t >= 1.0) {
            throwingShadow = false;
            shadowInCage = true;
            shadowGuy.rotation.z = 0;
            if (ghostGuy) ghostGuy.visible = true;
            playChime();
            objectiveEl.textContent = "👻 Shadow Guy caged! Now go catch the TELEPORTING GHOST in the forest!";
          }
        }
        if (throwingGhost && ghostGuy) {
          throwProgress += dt * 1.6;
          const t = Math.min(throwProgress, 1.0);
          ghostGuy.position.x = THREE.MathUtils.lerp(throwStartPos.x, rareCage2Pos.x, t);
          ghostGuy.position.z = THREE.MathUtils.lerp(throwStartPos.z, rareCage2Pos.z, t);
          ghostGuy.position.y = Math.sin(t * Math.PI) * 2.5 + 0.5 * t;
          if (t >= 1.0) {
            throwingGhost = false;
            ghostInCage = true;
            if (houseBossDefs[0] && houseBossDefs[0].obj) houseBossDefs[0].obj.visible = true;
            playChime();
            objectiveEl.textContent = "🌈🐍 SUPER-RARE BOSS UNLOCKED! Find the Rainbow Snake deep in the forest!";
          }
        }

        // 3 SUPER-RARE HARD-TO-FIND HOUSE BOSSES (Rainbow Snake -> Flying Pumpkin -> Bone Breaker!)
        if (ghostInCage && !allBossesCaged && bossIdx < houseBossDefs.length) {
          const bdef = houseBossDefs[bossIdx];
          if (bdef && bdef.obj) {
            bdef.obj.visible = true;
            if (bdef.flies && !activeBossThrowing) {
              bdef.obj.position.y = 2.4 + Math.sin(clock.elapsedTime * 6) * 0.5;
              // Crazy Flying Pumpkin zips around in the air!
              if (!activeBossCaptured) {
                bdef.obj.position.x += Math.cos(clock.elapsedTime * 2.2) * 3.5 * dt;
                bdef.obj.position.z += Math.sin(clock.elapsedTime * 2.2) * 3.5 * dt;
              }
            }
            if (activeBossThrowing) {
              throwProgress += dt * 1.6;
              const t = Math.min(throwProgress, 1.0);
              bdef.obj.position.x = THREE.MathUtils.lerp(throwStartPos.x, bdef.cagePos.x, t);
              bdef.obj.position.z = THREE.MathUtils.lerp(throwStartPos.z, bdef.cagePos.z, t);
              bdef.obj.position.y = Math.sin(t * Math.PI) * 2.8 + (bdef.flies ? 0.9 : 0.2) * t;
              if (t >= 1.0) {
                activeBossThrowing = false;
                activeBossCaptured = false;
                money += 50;
                updateHudStats();
                playChime();
                bossIdx += 1;
                if (bossIdx < houseBossDefs.length) {
                  const nb = houseBossDefs[bossIdx];
                  if (nb.obj) nb.obj.visible = true;
                  objectiveEl.textContent = `🏆 ${bdef.label} CAGED (+$50)! Next Super-Rare Boss: ${nb.label}!`;
                } else {
                  allBossesCaged = true;
                  objectiveEl.textContent = "👑🏆 YOU BEAT THE ENTIRE GAME, BLAKE! EVERY SINGLE MONSTER & RARE BOSS CAGED!";
                }
              }
            } else if (activeBossCaptured) {
              const tx = player.position.x - forwardX * 2.2;
              const tz = player.position.z - forwardZ * 2.2;
              bdef.obj.position.x += (tx - bdef.obj.position.x) * 0.1;
              bdef.obj.position.z += (tz - bdef.obj.position.z) * 0.1;
              bdef.obj.rotation.y = player.rotation.y;
            } else {
              const dxB = player.position.x - bdef.obj.position.x;
              const dzB = player.position.z - bdef.obj.position.z;
              const distB = Math.hypot(dxB, dzB);
              if (distB < 14.0 && distB >= 2.3) {
                bdef.obj.position.x += (dxB / distB) * bdef.speed * dt;
                bdef.obj.position.z += (dzB / distB) * bdef.speed * dt;
                bdef.obj.rotation.y = Math.atan2(dxB, dzB);
              }
              if (distB < 2.3) {
                activeBossCaptured = true;
                playChime();
                objectiveEl.textContent = `🔥 You caught ${bdef.label}! Bring it to House Cage ${bdef.cageIdx + 1} & press SPACEBAR!`;
              }
            }
          }
        }

        // Contextual Action Prompts
        const switchPos = new THREE.Vector3(-4.8, 0, 1.5);
        const distPod = Math.hypot(player.position.x - firstPodPos.x, player.position.z - firstPodPos.z);
        const inCabin =
          player.position.x > -14.5 &&
          player.position.x < -5.5 &&
          player.position.z > 23.5 &&
          player.position.z < 32.5;
        const distCraft = craftTableObj ? Math.hypot(player.position.x - craftTableObj.position.x, player.position.z - craftTableObj.position.z) : 99;
        const distPortal = portalObjRef ? Math.hypot(player.position.x - portalObjRef.position.x, player.position.z - portalObjRef.position.z) : 99;
        const distPod2 = Math.hypot(player.position.x - secondPodPos.x, player.position.z - secondPodPos.z);
        const distPod3 = Math.hypot(player.position.x - thirdPodPos.x, player.position.z - thirdPodPos.z);
        const nearChoppable = clownInCage ? findChoppableNearPlayer() : null;

        if (!clownInCage && inCabin) {
          player.position.z = 23.2;
          objectiveEl.textContent = "🔒 House is LOCKED! Put the Clown in the First cage first!";
        }

        if (level === 1 && visitedLab && !lightTurnedOn && player.position.distanceTo(switchPos) < 3.5) {
          actionPromptEl.textContent = "Press SPACEBAR / E to Turn On the Light!";
          actionPromptEl.style.display = "block";
        } else if (clownCaptured && !clownInCage && !throwingClown && distPod < 5.0) {
          actionPromptEl.textContent = "Press SPACEBAR to Throw the clown in!";
          actionPromptEl.style.display = "block";
        } else if (clownInCage && inCabin && !borrowedMoney) {
          objectiveEl.textContent = "🏚️ It's abandoned! Go back to the Clown's cage and take $10 for free!";
          actionPromptEl.style.display = "none";
        } else if (clownInCage && !borrowedMoney && distPod < 5.0) {
          actionPromptEl.textContent = "Press SPACEBAR / E to Take $10 for free!";
          actionPromptEl.style.display = "block";
        } else if (clownInCage && inCabin && borrowedMoney && !paidForMoreRoom) {
          actionPromptEl.textContent = "Press SPACEBAR / E to Pay $10 & Fix House!";
          actionPromptEl.style.display = "block";
        } else if (laserCaptured && !laserInCage && distPod2 < 4.5) {
          actionPromptEl.textContent = "🤖 Press SPACEBAR / E to Put Laser Guy next to the Clown!";
          actionPromptEl.style.display = "block";
        } else if (laserInCage && !laserMoneyTaken && distPod2 < 4.5) {
          actionPromptEl.textContent = axeLevel >= 1 ? "💰 Press SPACEBAR / E to Get $10 from Laser Guy!" : "🪓 Craft a Lv.1 Axe first to get $10!";
          actionPromptEl.style.display = "block";
        } else if (slimeCaptured && !slimeInCage && distPod3 < 4.5) {
          actionPromptEl.textContent = "🟢 Press SPACEBAR / E to Put Slime Guy next to Laser Guy!";
          actionPromptEl.style.display = "block";
        } else if (slimeInCage && !slimeMoneyTaken && distPod3 < 4.5) {
          actionPromptEl.textContent = axeLevel >= 2 ? "💰 Press SPACEBAR / E to Get $10 from Slime Guy!" : "🪓 Craft a Lv.2 Axe (2 Wood + 1 Stone) for $10!";
          actionPromptEl.style.display = "block";
        } else if (clownInCage && distCraft < 2.8) {
          if (axeLevel === 0) actionPromptEl.textContent = "🔨 Press SPACEBAR / E to Craft Lv.1 Axe & Pickaxe!";
          else if (axeLevel === 1 && wood >= 2 && stone >= 1) actionPromptEl.textContent = "🪓✨ Press SPACEBAR / E to Craft LEVEL 2 AXE!";
          else if (wood >= 1) actionPromptEl.textContent = "🧱 Press SPACEBAR / E to Build a Wooden Block (1 Wood)!";
          else actionPromptEl.textContent = "🪵 Chop 2 Trees & 1 Rock for Level 2 Axe!";
          actionPromptEl.style.display = "block";
        } else if (paidForMoreRoom && distPortal < 2.6) {
          actionPromptEl.textContent = "🌀 Press SPACEBAR / E to Teleport back to the Real Lab!";
          actionPromptEl.style.display = "block";
        } else if (nearChoppable) {
          actionPromptEl.textContent = `🪓 Press SPACEBAR / E to Chop ${nearChoppable.category === "tree" ? "Tree (+1 Wood)" : "Rock (+1 Stone)"}!`;
          actionPromptEl.style.display = "block";
        } else {
          actionPromptEl.style.display = "none";
        }

        // Smooth high-angle follow camera (looks cleanly over walls!)
        const targetCamPos = new THREE.Vector3(
          player.position.x,
          player.position.y + 8.5,
          player.position.z + 5.5
        );
        camera.position.lerp(targetCamPos, 0.12);
        camera.lookAt(player.position.x, player.position.y + 1.0, player.position.z);

        renderer.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
