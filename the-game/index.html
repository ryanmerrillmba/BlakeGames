<!doctype html>
<html lang="en" data-game="the-game">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Game — Blake Games</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        overflow: hidden;
        background: #1e293b;
        color: #f8fafc;
        font-family: "Fredoka", "Space Grotesk", system-ui, -apple-system, sans-serif;
        user-select: none;
      }
      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        right: 16px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        pointer-events: none;
        z-index: 10;
      }
      .panel {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        border: 2px solid rgba(148, 163, 184, 0.35);
        border-radius: 16px;
        padding: 12px 18px;
        pointer-events: auto;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
        max-width: 480px;
      }
      .back-btn {
        display: inline-block;
        color: #93c5fd;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.95rem;
        margin-bottom: 6px;
      }
      .back-btn:hover {
        text-decoration: underline;
      }
      h1 {
        font-size: 1.4rem;
        color: #facc15;
        margin-bottom: 4px;
      }
      #objective {
        font-size: 1rem;
        color: #e2e8f0;
        line-height: 1.35;
      }
      #controls-hint {
        font-size: 0.9rem;
        color: #cbd5e1;
        text-align: right;
      }
      #action-prompt {
        position: fixed;
        bottom: 36px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(250, 204, 21, 0.96);
        color: #0f172a;
        border: none;
        font-weight: 800;
        font-size: 1.15rem;
        padding: 12px 26px;
        border-radius: 999px;
        box-shadow: 0 8px 25px rgba(250, 204, 21, 0.4);
        display: none;
        cursor: pointer;
        z-index: 15;
      }
      #minimap-wrap {
        position: fixed;
        bottom: 16px;
        left: 16px;
        background: rgba(15, 23, 42, 0.88);
        border: 2px solid rgba(148, 163, 184, 0.45);
        border-radius: 14px;
        padding: 8px;
        z-index: 14;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        text-align: center;
      }
      #minimap-label {
        font-size: 0.78rem;
        color: #cbd5e1;
        margin-top: 4px;
        font-weight: 700;
      }
      #start-overlay {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, rgba(15, 23, 42, 0.85), rgba(2, 6, 23, 0.96));
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 40;
        padding: 20px;
        text-align: center;
      }
      #start-overlay img {
        max-height: 62vh;
        max-width: 90vw;
        border-radius: 20px;
        border: 3px solid #facc15;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
        margin-bottom: 18px;
      }
      #start-play-btn {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: #ffffff;
        border: none;
        font-size: 1.4rem;
        font-weight: 800;
        padding: 14px 38px;
        border-radius: 999px;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(34, 197, 94, 0.45);
      }
      #start-play-btn:hover {
        transform: scale(1.05);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="start-overlay">
      <img src="./guys.png" alt="The Game Monsters" />
      <button id="start-play-btn" type="button">▶ PLAY THE GAME!</button>
    </div>

    <div id="hud">
      <div class="panel">
        <a class="back-btn" href="../index.html">← Back to Blake Games</a>
        <h1>The Game <span id="money-hud" style="color:#4ade80; font-size:1.1rem; margin-left:10px;">💰 $0</span></h1>
        <div id="objective">Objective: Walk through the door into the weird lab!</div>
      </div>
      <div style="position:relative; pointer-events:auto;">
        <button id="hamburger-btn" type="button" aria-label="Open Game Menu" style="background:rgba(15,23,42,0.92);color:#f8fafc;border:2px solid #38bdf8;border-radius:12px;padding:10px 16px;font-size:1.1rem;font-weight:900;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,0.45);display:flex;align-items:center;gap:8px;">
          <span style="font-size:1.3rem;line-height:1;">☰</span> Menu
        </button>
        <div id="hamburger-menu" style="display:none;position:absolute;top:52px;right:0;width:268px;background:rgba(15,23,42,0.96);border:2px solid #38bdf8;border-radius:14px;padding:12px;box-shadow:0 12px 32px rgba(0,0,0,0.65);backdrop-filter:blur(8px);flex-direction:column;gap:8px;z-index:40;">
          <div style="font-size:0.8rem;line-height:1.45;color:#cbd5e1;background:rgba(30,41,59,0.8);border-radius:10px;padding:8px 10px;border:1px solid #334155;">
            <strong style="color:#fde047;">Move:</strong> Click/Drag, or W A S D / Arrows<br />
            <strong style="color:#fde047;">Action:</strong> SPACEBAR / E &nbsp;|&nbsp; <strong style="color:#fde047;">Doors:</strong> F<br />
            <strong style="color:#fde047;">Attack:</strong> Q &nbsp;|&nbsp; <strong style="color:#fde047;">Weapons:</strong> 1 / 2 / 3
          </div>
          <button id="music-btn" type="button" style="width:100%;background:#38bdf8;color:#0f172a;border:none;border-radius:9px;padding:9px 12px;font-weight:800;font-size:0.92rem;cursor:pointer;text-align:left;">🔊 Music: ON</button>
          <button id="attack-btn" type="button" style="width:100%;background:#a855f7;color:#ffffff;border:none;border-radius:9px;padding:9px 12px;font-weight:800;font-size:0.92rem;cursor:pointer;text-align:left;">🔦 Flashlight Blast (Q)</button>
          <button id="shop-btn" type="button" style="width:100%;background:#f59e0b;color:#0f172a;border:none;border-radius:9px;padding:9px 12px;font-weight:800;font-size:0.92rem;cursor:pointer;text-align:left;">🛒 Buy Crazy Weapon ($10)</button>
          <button id="battle-btn" type="button" style="width:100%;background:#ef4444;color:#ffffff;border:none;border-radius:9px;padding:9px 12px;font-weight:800;font-size:0.92rem;cursor:pointer;text-align:left;">⚔️ Fight Outside!</button>
          <button id="badguys-bar" type="button" style="width:100%;background:linear-gradient(90deg,#7c3aed,#ef4444,#f59e0b);color:#ffffff;border:1.5px solid #fef08a;border-radius:9px;padding:10px 12px;font-weight:900;font-size:0.92rem;cursor:pointer;text-align:left;">👾 See All 21 Bad Guys!</button>
        </div>
      </div>
    </div>

    <button id="action-prompt" type="button">Action</button>

    <!-- Live Bad Guy Zone Portrait Card (shows picture of the bad guy when you enter their zone!) -->
    <div id="zone-card" style="display:none;position:fixed;top:140px;left:16px;z-index:24;background:rgba(15,23,42,0.92);border:2px solid #ef4444;border-radius:14px;padding:10px;width:168px;text-align:center;box-shadow:0 0 24px rgba(239,68,68,0.55);pointer-events:none;">
      <div style="font-size:0.72rem;font-weight:900;color:#fca5a5;letter-spacing:0.6px;margin-bottom:6px;">⚠️ BAD GUY ZONE</div>
      <canvas id="zone-canvas" width="144" height="144" style="border-radius:10px;border:2px solid #facc15;display:block;margin:0 auto;background:#020617;"></canvas>
      <div id="zone-name" style="margin-top:6px;font-size:0.95rem;font-weight:900;color:#fde047;">🤡 Clown</div>
      <div id="zone-dist" style="font-size:0.74rem;color:#cbd5e1;margin-top:2px;">Nearby!</div>
    </div>

    <!-- Bad Guys Gallery Modal -->
    <div id="badguys-modal" style="display:none;position:fixed;inset:0;z-index:80;background:rgba(2,6,14,0.94);backdrop-filter:blur(8px);overflow-y:auto;padding:24px;box-sizing:border-box;">
      <div style="max-width:960px;margin:0 auto;background:#0f172a;border:2px solid #f59e0b;border-radius:18px;padding:20px;color:#f8fafc;box-shadow:0 0 40px rgba(245,158,11,0.35);">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
          <h2 style="margin:0;font-size:1.5rem;color:#fde047;">👾 ALL 21 BAD GUYS IN THE GAME</h2>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button id="pull-vampire-btn" type="button" style="background:#dc2626;color:#ffffff;border:none;border-radius:10px;padding:8px 14px;font-size:0.95rem;font-weight:900;cursor:pointer;">🧛 Pull Up Vampire in Lab</button>
            <button id="bring-all-lab-btn" type="button" style="background:#7c3aed;color:#ffffff;border:none;border-radius:10px;padding:8px 14px;font-size:0.95rem;font-weight:900;cursor:pointer;">🏠 Bring ALL 21 Guys to Lab!</button>
            <button id="badguys-close-btn" type="button" style="background:#334155;color:#ffffff;border:none;border-radius:10px;padding:8px 16px;font-size:0.95rem;font-weight:900;cursor:pointer;">✕ Close</button>
          </div>
        </div>
        <div style="text-align:center;margin-bottom:16px;">
          <img src="./guys.png" alt="All Bad Guys Poster" style="max-width:100%;max-height:300px;border-radius:12px;border:2px solid #38bdf8;box-shadow:0 0 24px rgba(56,189,248,0.35);" />
        </div>
        <div id="badguys-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;"></div>
      </div>
    </div>

    <div id="minimap-wrap">
      <canvas id="minimap" width="170" height="170" style="border-radius:8px; display:block;"></canvas>
      <div id="minimap-label">🗺️ Map: 🔵 You | 🔴 Monster | 🟢 Cage</div>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x010308);
      scene.fog = new THREE.FogExp2(0x010308, 0.036);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 250);
      camera.position.set(0, 5, 7);

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.02;
      document.body.appendChild(renderer.domElement);

      // 10x Real-Time PBR Reflections (dimmed so the night stays pitch-dark outside your flashlight!)
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      const envTexture = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environment = envTexture;
      scene.environmentIntensity = 0.06;
      pmremGenerator.dispose();

      // Post-Processing Bloom Composer (cinematic glow matching all_guys.png!)
      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      const bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.35, // strength
        0.55, // radius
        0.88  // threshold (only true emissive eyes/portals/lasers bloom!)
      );
      composer.addPass(bloomPass);
      const bloomEnabled = true;

      // GPU Firefly / Spore Particle System (260 glowing points drifting through the forest!)
      const PARTICLE_COUNT = 260;
      const pGeo = new THREE.BufferGeometry();
      const pPos = new Float32Array(PARTICLE_COUNT * 3);
      const pCol = new Float32Array(PARTICLE_COUNT * 3);
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        pPos[i * 3] = (Math.random() - 0.5) * 110;
        pPos[i * 3 + 1] = 0.6 + Math.random() * 6.5;
        pPos[i * 3 + 2] = 4 + Math.random() * 110;
        const isBlue = i % 2 === 0;
        pCol[i * 3] = isBlue ? 0.25 : 1.0;
        pCol[i * 3 + 1] = isBlue ? 0.85 : 0.82;
        pCol[i * 3 + 2] = isBlue ? 1.0 : 0.25;
      }
      pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
      pGeo.setAttribute("color", new THREE.BufferAttribute(pCol, 3));
      const pMat = new THREE.PointsMaterial({
        size: 0.26,
        vertexColors: true,
        transparent: true,
        opacity: 0.85,
        depthWrite: false,
      });
      const fireflies = new THREE.Points(pGeo, pMat);
      scene.add(fireflies);

      let mixer = null;

      // Start Screen overlay (auto-hidden during ?autotest=1 or ?test=house)
      const startOverlay = document.getElementById("start-overlay");
      const urlParamsInit = new URLSearchParams(window.location.search);
      if (urlParamsInit.get("autotest") === "1" || urlParamsInit.get("test") === "house") {
        startOverlay.style.display = "none";
      }
      // =========================================================================
      // BACKGROUND MUSIC ENGINE (100% Local Stereo Tracks + Dynamic Boss Crossfade)
      // =========================================================================
      const musicSpooky = new Audio("./music_spooky.m4a");
      musicSpooky.loop = true;
      musicSpooky.volume = 0.36;
      const musicBoss = new Audio("./music_boss.m4a");
      musicBoss.loop = true;
      musicBoss.volume = 0.0;
      let musicEnabled = true;
      let musicStarted = false;
      const musicBtn = document.getElementById("music-btn");

      function startBackgroundMusic() {
        if (!musicEnabled || musicStarted) return;
        musicStarted = true;
        musicSpooky.play().catch(() => { musicStarted = false; });
        musicBoss.play().catch(() => {});
      }

      if (musicBtn) {
        musicBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          musicEnabled = !musicEnabled;
          musicBtn.textContent = musicEnabled ? "🔊 Music: ON" : "🔇 Music: OFF";
          musicBtn.style.background = musicEnabled ? "#38bdf8" : "#64748b";
          if (musicEnabled) {
            musicStarted = false;
            startBackgroundMusic();
          } else {
            musicSpooky.pause();
            musicBoss.pause();
          }
        });
      }
      window.addEventListener("pointerdown", startBackgroundMusic, { once: true });
      window.addEventListener("keydown", startBackgroundMusic, { once: true });

      document.getElementById("start-play-btn").addEventListener("click", () => {
        startOverlay.style.display = "none";
        if (audioCtx.state === "suspended") audioCtx.resume();
        startBackgroundMusic();
        playChime();
      });

      // Clean moonlit night sky + Giant 3D Framed Poster on the Lab wall
      const pendingSprites = [];
      let loadedGuysImage = null;

      const posterTex = new THREE.TextureLoader().load("./guys.png", (tex) => {
        loadedGuysImage = tex.image;
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.needsUpdate = true;
        // Apply crisp cropped CanvasTexture to every queued monster sprite!
        for (const item of pendingSprites) applyCroppedCanvasTexture(item);
      });
      posterTex.colorSpace = THREE.SRGBColorSpace;

      const posterMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(4.2, 5.6),
        new THREE.MeshBasicMaterial({ map: posterTex })
      );
      posterMesh.position.set(0, 2.7, -25.6);
      scene.add(posterMesh);

      function applyCroppedCanvasTexture({ sprite, xFrac, yFrac, wFrac, hFrac }) {
        if (!loadedGuysImage) return;
        const iw = loadedGuysImage.width;
        const ih = loadedGuysImage.height;
        const cw = 320, ch = 360;
        const cv = document.createElement("canvas");
        cv.width = cw;
        cv.height = ch;
        const ctx = cv.getContext("2d");
        // Rounded glowing frame cutout so each realistic monster pops cleanly in 3D!
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(6, 6, cw - 12, ch - 12, 28);
        ctx.clip();
        ctx.drawImage(
          loadedGuysImage,
          xFrac * iw, yFrac * ih, wFrac * iw, hFrac * ih,
          0, 0, cw, ch
        );
        ctx.restore();
        ctx.strokeStyle = "#facc15";
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.roundRect(6, 6, cw - 12, ch - 12, 28);
        ctx.stroke();

        const cTex = new THREE.CanvasTexture(cv);
        cTex.colorSpace = THREE.SRGBColorSpace;
        cTex.needsUpdate = true;
        sprite.material.map = cTex;
        sprite.material.needsUpdate = true;
      }

      // Attach a cropped realistic PNG 3D Sprite from guys.png (top-down image fractions!)
      function attachRealisticSprite(monsterRoot, xFrac, yFrac, wFrac, hFrac, scaleW, scaleH, yPos = 1.6) {
        if (!monsterRoot) return;
        const mat = new THREE.SpriteMaterial({ transparent: true });
        const sprite = new THREE.Sprite(mat);
        sprite.name = monsterRoot.name + "_RealisticPNG";
        sprite.scale.set(scaleW, scaleH, 1);
        sprite.position.set(0, yPos, 0);
        // Hide old blocky meshes inside monsterRoot so ONLY the realistic PNG shows!
        monsterRoot.traverse((ch) => {
          if (ch.isMesh) ch.visible = false;
        });
        monsterRoot.add(sprite);
        const entry = { sprite, xFrac, yFrac, wFrac, hFrac };
        pendingSprites.push(entry);
        if (loadedGuysImage) applyCroppedCanvasTexture(entry);
      }

      // Pitch-Dark Spooky Night Lighting — Your Flashlight Is All You Can See!
      const hemiLight = new THREE.HemisphereLight(0x1e3a8a, 0x020617, 0.05);
      scene.add(hemiLight);

      const ambient = new THREE.AmbientLight(0x0f172a, 0.03);
      scene.add(ambient);

      const sunLight = new THREE.DirectionalLight(0x3b82f6, 0.06);
      sunLight.position.set(18, 38, 22);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 1024;
      sunLight.shadow.mapSize.height = 1024;
      sunLight.shadow.camera.near = 1;
      sunLight.shadow.camera.far = 120;
      sunLight.shadow.camera.left = -45;
      sunLight.shadow.camera.right = 45;
      sunLight.shadow.camera.top = 45;
      sunLight.shadow.camera.bottom = -45;
      scene.add(sunLight);

      const cabinWarmLight = new THREE.PointLight(0xfbbf24, 5.5, 11);
      cabinWarmLight.position.set(-10, 3.0, 28);
      scene.add(cabinWarmLight);

      const darkRoomLight = new THREE.PointLight(0x93c5fd, 0.6, 12);
      darkRoomLight.position.set(0, 3.5, 0);
      scene.add(darkRoomLight);

      const labLight = new THREE.PointLight(0x38bdf8, 8.5, 22);
      labLight.position.set(0, 4.2, -15);
      scene.add(labLight);

      // Powerful Player Flashlight (cuts cleanly through pitch-dark night with real-time shadows!)
      const flashlight = new THREE.SpotLight(0xfffbeb, 125, 38, Math.PI / 4.2, 0.45, 1.05);
      flashlight.castShadow = true;
      flashlight.shadow.mapSize.width = 1024;
      flashlight.shadow.mapSize.height = 1024;
      const flashlightTarget = new THREE.Object3D();
      scene.add(flashlight);
      scene.add(flashlightTarget);
      flashlight.target = flashlightTarget;

      // Tiny close-range glow right around Blake so you can always see yourself in the dark
      const playerAuraLight = new THREE.PointLight(0x93c5fd, 1.6, 3.4);
      scene.add(playerAuraLight);

      // Game State
      let player = null;
      let legL = null, legR = null, armL = null, armR = null;
      let flashlightMesh = null;
      let clown = null;
      let clownLegL = null, clownLegR = null;
      let laserGuy = null;
      let laserLegL = null, laserLegR = null;
      let laserBeam = null;
      let laserTimer = 0;
      let laserActive = 0;
      let laserCaptured = false;
      let throwingLaser = false;
      let laserInCage = false;
      let laserMoneyTaken = false;
      let slimeGuy = null;
      let slimeCaptured = false;
      let throwingSlime = false;
      let slimeInCage = false;
      let slimeMoneyTaken = false;
      let shadowGuy = null;
      let shadowCaptured = false;
      let throwingShadow = false;
      let shadowInCage = false;
      let ghostGuy = null;
      let ghostCaptured = false;
      let throwingGhost = false;
      let ghostInCage = false;
      let ghostTeleportTimer = 0;

      // 9 Lab Monsters queue (Pods 4..12) unlocked one by one after Slime Guy!
      const labMonsterDefs = [
        { key: "Monster_Vampire", label: "🧛 Vampire", podIdx: 3, flies: false },
        { key: "Monster_Witch", label: "🧙 Witch", podIdx: 4, flies: true },
        { key: "Monster_Pumpkin", label: "🎃 Pumpkin", podIdx: 5, flies: false },
        { key: "Monster_Cat", label: "🐈‍⬛ Cat", podIdx: 6, flies: false },
        { key: "Monster_Bat", label: "🦇 Bat", podIdx: 7, flies: true },
        { key: "Monster_Spider", label: "🕷️ Spider", podIdx: 8, flies: false },
        { key: "Monster_Skeleton", label: "💀 Skeleton", podIdx: 9, flies: false },
        { key: "Monster_Eyeball", label: "👁️ Magical Eyeball", podIdx: 10, flies: true },
        { key: "Monster_Robot", label: "🤖 Robot", podIdx: 11, flies: false },
        { key: "Monster_Frankenstein", label: "🧟‍♂️ Frankenstein", podIdx: 12, flies: false },
        { key: "Monster_Zombie", label: "🧟 Zombie", podIdx: 13, flies: false },
        { key: "Monster_Werewolf", label: "🐺 Gray Werewolf", podIdx: 12, loftCageIdx: 0, flies: false },
        { key: "Monster_Mummy", label: "🧻 Mummy", podIdx: 13, loftCageIdx: 1, flies: false },
      ];
      let onLoft = false;
      const ladderPos = new THREE.Vector3(9.5, 0, -22.0);

      // 3 Super-Rare Hard-to-Find House Bosses (unlocks ONLY far in the game after Shadow Guy & Ghost!)
      const houseBossDefs = [
        { key: "Monster_RainbowSnake", label: "🌈🐍 Rainbow Snake (RARE BOSS)", cageIdx: 0, flies: false, speed: 3.4 },
        { key: "Monster_FlyingPumpkin", label: "🎃🪽 Crazy Flying Pumpkin (RARE BOSS)", cageIdx: 1, flies: true, speed: 4.2 },
        { key: "Monster_BoneBreaker", label: "🦴💥 Armored Bone Breaker (FINAL BOSS)", cageIdx: 2, flies: false, speed: 3.8 },
      ];
      let bossIdx = 0;
      let activeBossCaptured = false;
      let activeBossThrowing = false;
      let allBossesCaged = false;

      function updateWeaponVFX(dt) {
        if (weaponFlashLight.intensity > 0.1) {
          weaponFlashLight.intensity = Math.max(0, weaponFlashLight.intensity - dt * 75);
        }
        for (let i = activeWeaponVFX.length - 1; i >= 0; i--) {
          const v = activeWeaponVFX[i];
          v.age += dt;
          const p = v.age / v.maxAge;
          if (p >= 1.0) {
            scene.remove(v.grp);
            activeWeaponVFX.splice(i, 1);
            continue;
          }
          if (v.tier === 2) {
            v.grp.scale.setScalar(1.0 + p * 1.4);
            v.grp.position.z -= Math.cos(v.grp.rotation.y) * dt * 8.0;
            v.grp.position.x -= Math.sin(v.grp.rotation.y) * dt * 8.0;
          }
          for (const pt of v.particles) {
            pt.mesh.position.x += pt.vx * dt;
            pt.mesh.position.y += pt.vy * dt;
            pt.mesh.position.z += pt.vz * dt;
            pt.mesh.rotation.x += dt * 8;
            pt.mesh.rotation.y += dt * 10;
            pt.mesh.scale.setScalar(Math.max(0.05, 1.0 - p));
          }
          v.grp.traverse((c) => {
            if (c.isMesh && c.material && c.material.transparent) {
              c.material.opacity = Math.max(0, 1.0 - p);
            }
          });
        }
      }

      function fireWeaponAttack() {
        if (!player) return;
        const dmg = Math.max(1, weaponTier + 1);
        const reach = weaponTier === 3 ? 15.0 : weaponTier === 1 ? 12.0 : weaponTier === 2 ? 10.5 : 8.5;
        const activeName = weaponTier === 0 ? "🔦 Flashlight Blast" : weaponNames[weaponTier];

        attackRing.visible = true;
        spawnWeaponVFX(weaponTier);
        playWeaponSFX(weaponTier);

        if (battleMode && battleEnemies.length > 0) {
          let hits = 0;
          for (const e of battleEnemies) {
            if (e.hp <= 0 || !e.obj) continue;
            const dxE = e.obj.position.x - player.position.x;
            const dzE = e.obj.position.z - player.position.z;
            const d = Math.hypot(dxE, dzE);
            if (d < reach) {
              e.hp -= dmg;
              hits++;
              playMonsterSFX(e.key);
              // Knock enemy backward safely with Monster Physics!
              if (d > 0.1) moveMonsterSafe(e.obj, (dxE / d) * 3.2, (dzE / d) * 3.2, { wallsOnly: e.flies });
              if (e.hp <= 0) {
                e.obj.visible = false;
                money += 25;
                updateHudStats();
              }
            }
          }
          const alive = battleEnemies.filter((e) => e.hp > 0).length;
          if (alive === 0) {
            battleMode = false;
            playChime();
            objectiveEl.textContent = "🏆 YOU DEFEATED ALL THE BAD GUYS OUTSIDE! (+$25 each!)";
          } else if (hits > 0) {
            objectiveEl.textContent = `💥 Blasted ${hits} bad guy(s) with ${activeName}! ${alive} left!`;
          } else {
            objectiveEl.textContent = `⚡ Fired ${activeName}! Get closer to blast the ${alive} bad guys!`;
          }
        } else {
          // Even outside Battle Mode, Q blasts & knocks back any nearby bad guy in the forest!
          let knocked = 0;
          const allM = [clown, laserGuy, slimeGuy, shadowGuy, ghostGuy, ...labMonsterDefs.map((d) => d.obj), ...houseBossDefs.map((b) => b.obj)];
          for (const m of allM) {
            if (!m || !m.visible) continue;
            const dxM = m.position.x - player.position.x;
            const dzM = m.position.z - player.position.z;
            const d = Math.hypot(dxM, dzM);
            if (d > 0.2 && d < reach) {
              moveMonsterSafe(m, (dxM / d) * 2.4, (dzM / d) * 2.4);
              playMonsterSFX(m.name);
              knocked++;
            }

          objectiveEl.textContent = knocked > 0
            ? `💥 Blasted & stunned ${knocked} bad guy(s) with ${activeName}!`
            : `⚡ Fired ${activeName}! Press Q near bad guys or click ⚔️ Fight Outside!`;
        }
      }

      function getMonsterRig(root) {
        if (root.userData.rig) return root.userData.rig;
        const rig = {
          torso: null, head: null, hipL: null, hipR: null, shL: null, shR: null,
          wingL: null, wingR: null, tail: null,
          quadLegs: [], spiderLegs: [], roboArms: [], snakeSegs: [], magicRings: [],
          baseTorsoY: 0, baseHeadY: 0, baseSnakePos: [],
          phase: Math.random() * Math.PI * 2,
          prevX: root.position.x, prevZ: root.position.z,
          smoothSpeed: 0
        };
        root.traverse((c) => {
          const n = c.name;
          if (n.includes("_TorsoPivot")) { rig.torso = c; rig.baseTorsoY = c.position.y; }
          else if (n.includes("_HeadPivot")) { rig.head = c; rig.baseHeadY = c.position.y; }
          else if (n.includes("_HipPivot_L")) rig.hipL = c;
          else if (n.includes("_HipPivot_R")) rig.hipR = c;
          else if (n.includes("_ShoulderPivot_L")) rig.shL = c;
          else if (n.includes("_ShoulderPivot_R")) rig.shR = c;
          else if (n.includes("WingPivot_L")) rig.wingL = c;
          else if (n.includes("WingPivot_R")) rig.wingR = c;
          else if (n.includes("_TailPivot")) rig.tail = c;
          else if (n.includes("_HipPivot_FL") || n.includes("_HipPivot_FR") || n.includes("_HipPivot_BL") || n.includes("_HipPivot_BR")) {
            rig.quadLegs.push({ obj: c, isDiagA: n.includes("_FL") || n.includes("_BR") });
          } else if (n.includes("Spider_LegPivot_")) {
            rig.spiderLegs.push({ obj: c, idx: parseInt(n.split("_").pop(), 10) || 0, baseRotY: c.rotation.y });
          } else if (n.includes("Robo_ArmPivot_")) {
            rig.roboArms.push({ obj: c, idx: parseInt(n.split("_").pop(), 10) || 0 });
          } else if (n.startsWith("SnakeSeg_")) {
            const idx = parseInt(n.split("_").pop(), 10) || 0;
            rig.snakeSegs.push({ obj: c, idx, baseX: c.position.x, baseY: c.position.y });
          } else if (n.includes("MagicRing_")) {
            rig.magicRings.push(c);
          }
        });
        rig.snakeSegs.sort((a, b) => a.idx - b.idx);
        root.userData.rig = rig;
        return rig;
      }

      function updateLifelikeMonster(root, dt, t, playerObj) {
        if (!root || !root.visible) return;
        const rig = getMonsterRig(root);
        const safeDt = Math.max(dt, 0.001);
        const vx = (root.position.x - rig.prevX) / safeDt;
        const vz = (root.position.z - rig.prevZ) / safeDt;
        const rawSpeed = Math.hypot(vx, vz);
        rig.prevX = root.position.x;
        rig.prevZ = root.position.z;

        // Smooth speed blend (0 = standing/caged idle, 1 = full walk/run/chase/follow!)
        rig.smoothSpeed = THREE.MathUtils.lerp(rig.smoothSpeed, Math.min(rawSpeed / 2.2, 1.4), 0.16);
        const moveBlend = Math.min(rig.smoothSpeed, 1.0);
        const isMoving = moveBlend > 0.08;

        // Advance personal walk/idle phase smoothly
        const key = root.name || "";
        const freq = key.includes("Zombie") || key.includes("Mummy") ? 6.5 :
                     key.includes("BoneBreaker") || key.includes("Frankenstein") ? 7.2 :
                     key.includes("Spider") ? 16.0 :
                     key.includes("Clown") ? 11.5 : 9.5;
        rig.phase += dt * (2.2 + moveBlend * freq);
        const ph = rig.phase;

        // When moving (including chasing, patrolling & following after capture!), ALWAYS face forward!
        const faceOffset = key === "Monster_Clown" ? Math.PI : 0;
        if (rawSpeed > 0.25 && !key.includes("Eyeball")) {
          const targetYaw = Math.atan2(vx, vz) + faceOffset;
          let diff = targetYaw - root.rotation.y;
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          root.rotation.y += diff * Math.min(1, dt * 9.0);
        }

        // Expressive "Act Out" burst every ~3.5s so every monster jumps, taunts, waves, or lunges!
        const actWave = Math.max(0, Math.sin(t * 1.9 + root.id * 1.37) - 0.55) / 0.45; // 0..1 dramatic burst!

        // 1) BIPED LOCOMOTION + ALIVE IDLE BREATHING + ACTING OUT!
        if (rig.hipL && rig.hipR) {
          const stride = Math.sin(ph) * (0.68 * moveBlend);
          rig.hipL.rotation.x = stride;
          rig.hipR.rotation.x = -stride;
        }
        if (rig.shL && rig.shR) {
          const isOutstretched = key.includes("Zombie") || key.includes("Mummy");
          const isHammerBoss = key.includes("BoneBreaker");
          const idleArm = Math.sin(t * 2.2 + rig.phase * 0.1) * 0.08;
          const armSwing = Math.sin(ph) * (0.58 * moveBlend);
          if (isOutstretched) {
            rig.shL.rotation.x = -0.15 + Math.sin(t * 3.2) * 0.18 + armSwing * 0.35 - actWave * 0.45;
            rig.shR.rotation.x = -0.15 + Math.cos(t * 3.2) * 0.18 - armSwing * 0.35 - actWave * 0.45;
            rig.shL.rotation.z = Math.sin(t * 2.4) * 0.12 + actWave * 0.22;
            rig.shR.rotation.z = -Math.sin(t * 2.4) * 0.12 - actWave * 0.22;
          } else if (isHammerBoss) {
            rig.shL.rotation.x = -armSwing * 0.8 + idleArm - actWave * 0.5;
            // Heft & slam the massive Bone-Breaker warhammer dramatically!
            rig.shR.rotation.x = armSwing * 0.65 + Math.sin(t * 3.0) * 0.18 - actWave * 0.95;
          } else {
            rig.shL.rotation.x = -armSwing + idleArm - actWave * 0.75;
            rig.shR.rotation.x = armSwing - idleArm - actWave * 0.75;
            rig.shL.rotation.z = 0.06 + Math.sin(t * 2.4) * 0.06 + actWave * 0.48;
            rig.shR.rotation.z = -0.06 - Math.sin(t * 2.4) * 0.06 - actWave * 0.48;
          }
        }

        // 2) TORSO BREATHING, WEIGHT-SHIFT SWAY, WALK BOUNCE & ACT-OUT LEAP!
        if (rig.torso) {
          const breathe = Math.sin(t * 2.6 + root.id) * 0.035;
          const walkBounce = Math.abs(Math.sin(ph)) * 0.12 * moveBlend;
          const actHop = actWave * 0.22;
          rig.torso.position.y = rig.baseTorsoY + breathe + walkBounce + actHop;
          rig.torso.rotation.y = Math.sin(ph) * 0.15 * moveBlend + Math.sin(t * 1.6 + root.id) * 0.10 * (1 - moveBlend);
          rig.torso.rotation.z = Math.cos(ph) * 0.07 * moveBlend + Math.sin(t * 2.0 + root.id) * 0.05;
          rig.torso.rotation.x = 0.08 * moveBlend + actWave * 0.12;
        }

        // 3) HEAD TRACKING (Looks toward Blake cleanly, respecting faceOffset!)
        if (rig.head) {
          let lookYaw = Math.sin(t * 1.7 + root.id) * 0.28;
          if (playerObj) {
            const dxP = playerObj.position.x - root.position.x;
            const dzP = playerObj.position.z - root.position.z;
            if (Math.hypot(dxP, dzP) < 12.0) {
              const worldYaw = Math.atan2(dxP, dzP) + faceOffset;
              let rel = worldYaw - root.rotation.y;
              while (rel > Math.PI) rel -= Math.PI * 2;
              while (rel < -Math.PI) rel += Math.PI * 2;
              lookYaw = THREE.MathUtils.clamp(rel, -0.75, 0.75);
            }
          }
          rig.head.rotation.y = THREE.MathUtils.lerp(rig.head.rotation.y, lookYaw, 0.12);
          rig.head.rotation.z = Math.sin(t * 2.4 + root.id) * 0.10 + actWave * 0.15;
        }

        // 4) QUADRUPED (Cat) — 4-Leg Trot + Wagging Tail
        if (rig.quadLegs.length > 0) {
          const qSwing = Math.sin(ph * 1.1) * (0.65 * moveBlend);
          for (const ql of rig.quadLegs) {
            ql.obj.rotation.x = ql.isDiagA ? qSwing : -qSwing;
          }
        }
        if (rig.tail) {
          rig.tail.rotation.z = Math.sin(t * (4.0 + moveBlend * 5.0) + root.id) * 0.42;
          rig.tail.rotation.x = Math.sin(t * 2.5) * 0.12;
        }

        // 5) 8-ARM ELECTRIC ROBOT — All 8 Arms Flexing & Crackling Independently!
        if (rig.roboArms.length > 0) {
          for (const ra of rig.roboArms) {
            const wave = Math.sin(t * (4.5 + moveBlend * 4.5) + ra.idx * 0.85);
            ra.obj.rotation.x = wave * (0.28 + 0.22 * moveBlend);
            ra.obj.rotation.z = Math.cos(t * 3.8 + ra.idx * 1.1) * 0.18;
          }
        }

        // 6) SPIDER — 8-Leg Alternating Wave Skitter (alive idle twitch + fast skitter!)
        if (rig.spiderLegs.length > 0) {
          for (const sl of rig.spiderLegs) {
            const amp = 0.12 + 0.45 * moveBlend;
            const sWave = Math.sin(ph + sl.idx * 1.55) * amp;
            sl.obj.rotation.z = sWave * 0.65;
            sl.obj.rotation.y = sl.baseRotY + Math.cos(ph + sl.idx * 1.55) * amp * 0.5;
          }
        }

        // 7) WINGED FLYERS (Bat, Flying Pumpkin) — Rapid Flapping + Idle Wing Breathing
        if (rig.wingL && rig.wingR) {
          const flapSpeed = isMoving ? 15.0 : 8.5;
          const flapAmp = isMoving ? 0.72 : 0.42;
          const flap = Math.sin(t * flapSpeed + root.id) * flapAmp;
          rig.wingL.rotation.z = flap;
          rig.wingR.rotation.z = -flap;
        }

        // 8) RAINBOW SNAKE — True Sinusoidal S-Curve Slithering across all 12 segments!
        if (rig.snakeSegs.length > 0) {
          const slitherAmp = 0.22 + 0.34 * moveBlend;
          const slitherSpd = 3.5 + 4.5 * moveBlend;
          for (const seg of rig.snakeSegs) {
            const wave = Math.sin(t * slitherSpd - seg.idx * 0.58);
            seg.obj.position.x = seg.baseX + wave * slitherAmp * (0.35 + seg.idx * 0.08);
            seg.obj.rotation.y = Math.cos(t * slitherSpd - seg.idx * 0.58) * 0.28;
            if (seg.idx === 0) {
              seg.obj.position.y = seg.baseY + Math.sin(t * 3.0) * 0.08;
            }
          }
        }

        // 9) SLIME GUY — Squash-and-Stretch Gelatinous Hop & Jiggle!
        if (key === "Monster_SlimeGuy") {
          const hop = Math.sin(t * (4.5 + moveBlend * 4.0));
          const stretch = 1.0 + hop * (0.12 + 0.16 * moveBlend);
          const squash = 1.0 / Math.sqrt(Math.max(0.5, stretch));
          root.scale.set(squash, stretch, squash);
        }

        // 10) MAGICAL EYEBALL & SHADOW GUY — Orbiting Magic Rings & Sparks!
        for (let i = 0; i < rig.magicRings.length; i++) {
          rig.magicRings[i].rotation.y = t * (i % 2 === 0 ? 2.4 : -3.1);
          rig.magicRings[i].rotation.z = Math.sin(t * 1.8 + i) * 0.35;
        }
      }

      function drawMinimap() {
        if (!player || !mapCtx) return;
        const w = minimapCanvas.width, h = minimapCanvas.height;
        mapCtx.fillStyle = "#0b1324";
        mapCtx.fillRect(0, 0, w, h);

        // Map world coordinates (X: -60..60, Z: -30..105) -> canvas
        const toX = (wx) => ((wx + 60) / 120) * w;
        const toY = (wz) => ((wz + 30) / 135) * h;

        // Draw Lab (top), Dark Room (center-top), Forest (bottom), House (left forest)
        mapCtx.fillStyle = "#1e3a2f";
        mapCtx.fillRect(toX(-12), toY(-26), toX(12) - toX(-12), toY(-4) - toY(-26)); // Lab
        mapCtx.fillStyle = "#334155";
        mapCtx.fillRect(toX(-5), toY(-4), toX(5) - toX(-5), toY(4) - toY(-4)); // Dark Room
        mapCtx.fillStyle = "#14532d";
        mapCtx.fillRect(toX(-55), toY(4), toX(55) - toX(-55), toY(100) - toY(4)); // Forest

      // Rich Web Audio API Sound Effects ("a lot of noise!")
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      function playTone(freq, duration, type = "sine", vol = 0.14) {
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      }
      function playNoiseBurst(duration = 0.15, vol = 0.12) {
        if (audioCtx.state === "suspended") audioCtx.resume();
        const bufferSize = Math.floor(audioCtx.sampleRate * duration);
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
        const src = audioCtx.createBufferSource();
        src.buffer = buffer;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        src.connect(gain);
        gain.connect(audioCtx.destination);
        src.start();
      }

      function playSweep(fStart, fEnd, dur, type = "sine", vol = 0.14) {
        if (isRunningAutoTest) return;
        if (audioCtx.state === "suspended") audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(Math.max(20, fStart), now);
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, fEnd), now + dur);
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + dur);
      }
